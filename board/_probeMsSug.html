<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function ok(c,k,v){ o.push((c?'◎ ':'✗ ')+k+': '+v); }
  function sh(){ return document.getElementById('sheet'); }
  try{
    localStorage.clear(); resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen(); setView('work'); paint();

    var idx = -1;
    STAFF.forEach(function(x,i){ if (x.k==='마샬' && idx<0) idx=i; });
    L('마샬 칸', idx+'번 · 지금 ['+(STAFF[idx].n||'비어 있음')+']');
    openSlot('staff', idx);

    L('','★갑. 밑에 이름 늘어놓던 줄');
    ok(!sh().querySelector('.sug'), '  이름 목록', sh().querySelector('.sug')?'★남음':'없음 ◎');
    ok(!sh().querySelector('[data-n]'), '  이름 단추', sh().querySelectorAll('[data-n]').length+'개');
    ok(!/후보가 없습니다/.test(sh().textContent), "  '후보가 없습니다'", '없음 ◎');

    L('','★을. 나머지는 그대로인가');
    ok(!!sh().querySelector('#slotName'), '  이름 치는 칸', '있음');
    ok(!!sh().querySelector('#slotTime'), '  시각 칸', '있음');
    var acts = [].slice.call(sh().querySelectorAll('button[data-act]'))
      .map(function(b){ return b.textContent.trim(); });
    L('  단추', acts.join(' / '));
    ok(acts.indexOf('넣기')>=0 && acts.indexOf('비우기')>=0 && acts.indexOf('이 칸 없애기')>=0,
       '  넣기·비우기·칸 없애기', acts.join(' / '));

    L('','★병. 이름을 쳐 넣는 길은 살아 있나');
    var pick = JONAMES.filter(function(n){ return !isBu3(n); })[0];
    sh().querySelector('#slotName').value = pick;
    sh().querySelector('[data-act="slotsave"]')
      .dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
    L('  넣은 뒤 STAFF['+idx+']', STAFF[idx].n||'(빔)');
    ok(STAFF[idx].n===pick, '  이름이 들어갔나', STAFF[idx].n||'★안 들어감');
    ok(tagOf(pick)==='배치', "  근무표에 '배치'가 붙나", tagOf(pick)||'(없음)');

    L('','★정. 당번 창은 그대로 이름이 뜨나');
    openDuty(DUTYKEYS[0]);
    ok(!!sh().querySelector('.sug'), '  당번 창 이름 목록', sh().querySelector('.sug')?'있음 ◎':'★없어짐');
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length?E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},1500);
</script>
