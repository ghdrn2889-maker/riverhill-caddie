<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function ok(c,k,v){ o.push((c?'◎ ':'✗ ')+k+': '+v); }
  function tap(el){ if(!el) return false;
    el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})); return true; }
  function type(el,v){ el.value=v; el.dispatchEvent(new Event('input',{bubbles:true})); }
  function seatOf(n){
    var out=[];
    DAY.forEach(function(p){ active(p).forEach(function(r,i){
      if(r.n!==n) return;
      out.push(p.name+' '+(i+1)+'번'+(i<p.tees.length?' · '+p.tees[i].time:' · 대기'));
    });});
    return out.join(' / ')||'없음';
  }
  function rows(){ var e=$('seatOut'); return e? [].slice.call(e.querySelectorAll('[data-seatn]'))
    .map(function(b){return b.getAttribute('data-seatn');}) : null; }
  function heads(){ var e=$('seatOut'); return e? [].slice.call(e.querySelectorAll('.hd2'))
    .map(function(b){return b.textContent.trim();}) : []; }
  try{
    localStorage.clear(); resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen(); setView('board');
    DAY.forEach(function(p){ p.roster=[]; }); OFFDUTY=JONAMES.slice(); ABSFROM={};
    addRow('1','김상미'); addRow('1','전형준');       // 1부 대기 둘
    paint();

    L('★1부 1번(빈 칸)을 연다','');
    openCell('1', 0);
    ok(!!$('seatQ'),'  이름 치는 칸', $('seatQ')?'있음':'★없음');
    ok(!$('shName'),'  옛 바꾸기 칸', $('shName')?'★아직 있다':'없음');
    L('  묶음 머리', heads().join(' / '));
    L('  처음 목록 앞 6', (rows()||[]).slice(0,6).join(' '));

    // ── 갑. 이름을 치면 걸러진다
    o.push(''); L('★갑. "홍구"를 친다','');
    type($('seatQ'),'홍구');
    L('  걸러진 목록', (rows()||[]).join(' '));
    ok((rows()||[]).length===1 && rows()[0]==='김홍구','  하나로 좁혀지나', (rows()||[]).join(' ')||'★없음');

    // ── 을. 눌러서 앉힌다
    o.push(''); L('★을. 김홍구를 누른다','');
    tap($('seatOut').querySelector('[data-seatn="김홍구"]'));
    ok(/1부 1번 · /.test(seatOf('김홍구')),'  김홍구 자리', seatOf('김홍구'));
    L('  기록', LOG[0]?LOG[0].msg:'(없음)');

    // ── 병. 대기에 있던 사람은 '대기' 묶음에 뜨고, 앉히면 옮겨진다
    o.push(''); L('★병. 1부 2번 칸을 열고 대기 사람을 앉힌다','');
    openCell('1', 1);
    L('  묶음 머리', heads().join(' / '));
    ok(heads().some(function(h){return /1부 대기/.test(h);}),'  이 부 대기 묶음', heads().join(' / '));
    L('  앉히기 전 김상미', seatOf('김상미'));
    tap($('seatOut').querySelector('[data-seatn="김상미"]'));
    ok(seatOf('김상미').split('/').length===1 && /1부 2번/.test(seatOf('김상미')),
       '  앉힌 뒤 김상미', seatOf('김상미')+' (둘로 안 나뉘어야 한다)');

    // ── 정. 이름을 치고 '앉히기' 단추
    o.push(''); L('★정. 3번 칸에 "수련" 치고 앉히기','');
    openCell('1', 2);
    type($('seatQ'),'수련');
    tap([].slice.call($('sheet').querySelectorAll('button')).filter(function(b){
      return b.getAttribute('data-act')==='seatgo';})[0]);
    ok(/1부 3번/.test(seatOf('이수련')),'  이수련 자리', seatOf('이수련'));

    // ── 무. 명부에 없는 이름은 안 들어간다
    o.push(''); L('★무. 없는 이름 "홍길동"','');
    openCell('1', 3);
    type($('seatQ'),'홍길동');
    L('  목록', (rows()||[]).length? rows().join(' ') : '(빈 목록)');
    tap([].slice.call($('sheet').querySelectorAll('button')).filter(function(b){
      return b.getAttribute('data-act')==='seatgo';})[0]);
    ok(seatOf('홍길동')==='없음','  홍길동', seatOf('홍길동')+' (명부에 없으니 안 앉아야 한다)');
    ok(!active(part('1'))[3].n,'  1부 4번 칸', active(part('1'))[3].n||'비어 있음 ◎');

    // ── 기. 사람이 앉은 칸은 옛 '바꾸기'가 그대로
    o.push(''); L('★기. 사람이 앉은 칸','');
    openCell('1', 0);
    ok(!!$('shName'),'  바꾸기 칸', $('shName')?'있음 ◎ ('+$('shName').value+')':'★없어졌다');
    ok(!$('seatQ'),'  앉히기 칸', $('seatQ')?'★있다':'없음 ◎');
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length?E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},1500);
</script>
