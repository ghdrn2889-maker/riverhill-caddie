<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function at(pk, n){ var p=part(pk), a=active(p).map(function(r){ return r.n; });
    var i = a.indexOf(n); return i<0 ? '없음' : seatNo(p, i)+'번'; }
  function boot(){ localStorage.clear(); resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen(); }
  var jc = JONAMES[10], dup = JONAMES[20];
  try{
    // ── ⓐ 조출만 못 박고 세우기
    boot();
    setDayTag(jc, '조출');
    insertAt('1', 19, jc);
    L('ⓐ 조출 ' + jc + ' 1부 20번에 못 박음', at('1', jc));
    applyLineup(seonbal(), ['1','2']);
    L('  ★순번 세운 뒤', at('1', jc) + (at('1',jc)==='20번' ? ' ◎ 그대로' : ' ✗ 움직임'));
    applyLineup(seonbal(), ['1','2']);
    L('  한 번 더 세워도', at('1', jc) + (at('1',jc)==='20번' ? ' ◎' : ' ✗'));

    // ── ⓑ 중복 근무자를 배지 없이 못 박고 세우기
    boot();
    insertAt('1', 4, dup); insertAt('2', 2, dup);
    L('', '');
    L('ⓑ 중복 ' + dup + ' (배지 없음)', '1부 ' + at('1', dup) + ' · 2부 ' + at('2', dup));
    applyLineup(seonbal(), ['1','2']);
    L('  ★순번 세운 뒤', '1부 ' + at('1', dup) + ' · 2부 ' + at('2', dup)
      + '  ✗ 배지가 없으면 순번이 다시 정한다');

    // ── ⓒ 중복 근무자에게도 배지를 주면?
    boot();
    setDayTag(dup, '정출');
    insertAt('1', 4, dup); insertAt('2', 2, dup);
    L('', '');
    L('ⓒ 중복 ' + dup + ' 에 정출 배지', '1부 ' + at('1', dup) + ' · 2부 ' + at('2', dup));
    applyLineup(seonbal(), ['1','2']);
    L('  ★순번 세운 뒤', '1부 ' + at('1', dup) + ' · 2부 ' + at('2', dup)
      + (at('1',dup)==='5번' && at('2',dup)==='3번' ? '  ◎ 그대로' : '  ✗'));

    // ── ⓓ 세우고 나서 못 박으면 (반대 순서)
    boot();
    setDayTag(jc, '조출');
    applyLineup(seonbal(), ['1','2']);
    insertAt('1', 19, jc);
    L('', '');
    L('ⓓ 먼저 세우고 나중에 못 박기', '조출 ' + at('1', jc)
      + ' · 1부 인원 ' + active(part('1')).length + '명 / 팀 ' + part('1').tees.length);
    L('  ▶ 뒤로 밀린 사람이', active(part('1')).length > part('1').tees.length
      ? (active(part('1')).length - part('1').tees.length) + '명 대기로 내려감' : '없음');
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},900);
</script>
