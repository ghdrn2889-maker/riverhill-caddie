<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function seatOf(pk,nm){ var p=part(pk),a=active(p);
    for(var i=0;i<a.length;i++) if(a[i].n===nm) return seatNo(p,i); return 0; }
  function seats(pk,a,b){ var p=part(pk); return active(p).slice(a,b).map(function(r,j){
    var i=a+j; return (r.itn?'인턴':seatNo(p,i))+' '+(r.n||'(빔)')+(r.tag?' '+r.tag:''); }); }
  function tot(){ var t=0; DAY.forEach(function(p){ active(p).forEach(function(r){ if(r.n) t++; }); }); return t; }
  try{
    localStorage.clear(); CARRY.seats=true; resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen(); setView('board'); cur='2'; paint();

    // ★사용자 상황 그대로 — 2부에 이미 앉아 있는 사람들에게 조출 배지를 단다
    var p2 = active(part('2')).filter(function(r){ return r.n && !r.itn; });
    var jo = [];
    [4, 9, 14, 19, 2, 6].forEach(function(k){ if (p2[k] && jo.length < 4) jo.push(p2[k].n); });
    jo.forEach(function(n){ TAG[n] = '조출';
      DAY.forEach(function(q){ q.roster.forEach(function(r){ if (r.n===n) r.tag='조출'; }); }); });
    // 1부에만 앉은 조출 한 명 — 2부 칸에서는 안 불러야 한다
    var other = active(part('1'))[3].n;
    TAG[other] = '조출';
    paint();
    var tot0 = tot();
    L('2부에 앉은 조출 4명', jo.map(function(n){ return n+':'+seatOf('2',n); }).join(' '));
    L('1부에만 앉은 조출', other + ':1부' + seatOf('1',other) + ' / 2부' + (seatOf('2',other)||'없음'));

    openCell('2', 0);
    var sh = document.getElementById('sheet');
    var gb = [].slice.call(sh.querySelectorAll('[data-sg]'));
    L('', '');
    L('2부 1번 칸 묶음', gb.map(function(b){ return b.textContent; }).join(' / ') || '없음');
    var box = [].slice.call(sh.querySelectorAll('.grp')).filter(function(x){
      return x.textContent.indexOf('한꺼번에 앉히기')>=0; })[0];
    L('  까닭 줄', box ? box.textContent.replace(/\s+/g,' ').split('차례는 조 편성이 정합니다.').pop().trim() : '-');

    if (gb.length){
      gb[0].click();
      L('', '');
      L('★눌렀더니 2부 1~6번', seats('2',0,6).join(' | '));
      var g = jo.map(function(n){ return seatOf('2',n); }).sort(function(a,b){return a-b;});
      L('  네 명 번호', g.join(',') + (g.join(',')==='1,2,3,4' ? ' ◎ 1~4 연달아' : ' 어긋남'));
      L('  배치표 전체', tot0 + ' → ' + tot() + (tot()===tot0 ? ' ◎ 안 늘었다(옮긴 것)' : ' 늘었다 — 중복이 생겼다'));
      L('  1부만 있던 ' + other, '1부' + seatOf('1',other) + ' / 2부' + (seatOf('2',other)||'없음')
        + (seatOf('2',other) ? ' — 끌려 들어옴(문제)' : ' ◎ 그대로'));
      L('  기록', LOG[0]?LOG[0].msg:'없음');

      setSeonbal(active(part('1'))[0].n);
      applyLineup(active(part('1'))[0].n, ['1','2']);
      var g2 = jo.map(function(n){ return seatOf('2',n); }).sort(function(a,b){return a-b;});
      L('  순번 세운 뒤', g2.join(',') + (g2.join(',')===g.join(',') ? ' ◎ 그대로' : ' 쓸려 나감'));
    }
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},900);
</script>
