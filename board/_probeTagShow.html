<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function dump(n){
    var r=document.querySelector('#workTable [data-who="'+n+'"]');
    if(!r) return '(줄 없음)';
    return [].slice.call(r.children).map(function(e){
      var t=e.textContent.trim(); if(!t) return '';
      return e.className.replace(/\s+/g,'.')+'="'+t+'"';
    }).filter(Boolean).join('  ');
  }
  function cellOf(n){
    var out=[];
    [].slice.call(document.querySelectorAll('#cols .cell[data-nm]')).forEach(function(c){
      if(c.getAttribute('data-nm')!==n) return;
      var bg=getComputedStyle(c).backgroundColor;
      out.push(c.className.replace(/\s+/g,'.')+' bg='+bg
        +' 배지['+[].slice.call(c.querySelectorAll('.tag')).map(function(t){return t.textContent.trim();}).join('][')+']');
    });
    return out.join(' / ')||'(칸 없음)';
  }
  try{
    localStorage.clear(); resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen();
    applyLineup(seonbal(), ['1','2']); applyLineup(bu3Start(), ['3']);

    // 다섯 가지를 실제로 만든다
    var pool=JONAMES.filter(function(n){ return !tagOf(n) && partsOf(n).length===1; });
    var A=pool[0], B=pool[1], C=pool[2], D=pool[3], F=pool[4];
    setDayTag(A,'조출'); setDayTag(B,'후출');
    // 중복 근무 — 두 부에 앉혀야 배지가 산다
    addRow('2', C); setDayTag(C,'54');
    addRow('3', D); setDayTag(D,'2,3');
    addRow('3', F); setDayTag(F,'1,3');
    setView('work'); paint();

    L('★근무표 줄 (칸마다 class="글")','');
    [[A,'조출'],[B,'후출'],[C,'54'],[D,'2,3'],[F,'1,3']].forEach(function(x){
      L('  '+x[1]+' · '+x[0], dump(x[0]));
    });
    o.push('');
    L('★기계가 말하는 것','');
    [[A,'조출'],[B,'후출'],[C,'54'],[D,'2,3'],[F,'1,3']].forEach(function(x){
      var n=x[0];
      L('  '+x[1], 'tagOf='+tagOf(n)+' · wkBadges=['+wkBadges(n).join('][')+']'
        +' · 부='+partsOf(n).join(',')+' · tagCls='+tagCls(tagOf(n)));
    });
    o.push('');
    setView('board'); paint();
    L('★배치표 칸','');
    [[A,'조출'],[B,'후출'],[C,'54'],[D,'2,3'],[F,'1,3']].forEach(function(x){
      L('  '+x[1]+' · '+x[0], cellOf(x[0]));
    });
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length?E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},1500);
</script>
