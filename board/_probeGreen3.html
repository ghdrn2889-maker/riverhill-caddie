<style>*,*::before,*::after{transition:none!important;animation:none!important}</style>
<div id="PROBE"></div>
<script>
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function green(c){
    var m=/rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); if(!m) return false;
    var r=+m[1],g=+m[2],b=+m[3];
    return (g>r+8 && g>b+8);
  }
  var seen={};
  function scan(tag, root){
    root = root || document.querySelector('.stage');
    if(!root){ L(tag,'못 엶'); return; }
    var hit=[];
    [].slice.call(root.querySelectorAll('*')).forEach(function(el){
      if(el.children.length) return;
      var t=(el.textContent||'').trim();
      if(!t || t.length>8) return;
      var s=getComputedStyle(el);
      if(s.display==='none'||s.visibility==='hidden') return;
      if(!green(s.backgroundColor) && !green(s.color)) return;
      var k=t+'|'+String(el.className);
      if(seen[k]) return; seen[k]=1;
      hit.push('"'+t+'" ['+String(el.className).trim()+'] 바탕'+s.backgroundColor+' 글자'+s.color);
    });
    if(hit.length) { L(tag, ''); hit.forEach(function(h){ o.push('     '+h); }); }
  }
  try{
    localStorage.clear(); CARRY.seats=true; resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); drawKsz(); caughtSeen(); setView('work'); paint();

    // ★여러 상태를 일부러 만든다
    var W=workRows();
    var free=W.filter(function(r){ return !tagOf(r.n)&&r.cls==='w'; });
    setDayTag(free[0].n,'조출');
    setDayTag(free[1].n,'후출');
    setDayTag(free[2].n,'휴가');
    setDayTag(free[3].n,'휴무');
    setDayTag(free[4].n,'병가');
    setDayTag(free[5].n,'프리');
    setDayTag(free[6].n,'배치');
    setDayTag(free[7].n,'54');
    setDayTag(free[8].n,'2,3');
    setDayTag(free[9].n,'1,3');
    dutyToggle('당번', free[10].n);
    dutyToggle('벌당', free[11].n);
    // 두 부에 앉히기 — 상태칩이 '1,2' 같은 걸 말하게
    var d=free[12].n;
    if (partsOf(d).indexOf('2')<0) addRow('2', d);
    if (partsOf(d).indexOf('3')<0) addRow('3', d);
    // 인원수 다른 팀
    if (part('1').tees[0]) part('1').tees[0].pax = 2;
    paint();

    L('★근무표', ''); scan('  근무표');
    setView('board'); paint();
    L('★배치표', ''); scan('  배치표');
    openCell('3',1); scan('  칸 창', document.getElementById('sheet')); closeSheet(); paint();
    openInsert('3',1); scan('  끼워넣기', document.getElementById('sheet')); closeSheet(); paint();
    openDrawer(); scan('  순번·명단', document.getElementById('drw'));
    document.querySelectorAll('.drw').forEach(function(x){x.classList.remove('on');});
    openCfg(); scan('  설정', document.getElementById('cfg'));

    o.push('');
    L('★부 라고 적힌 것들의 색', '');
    setView('work'); paint();
    var m={};
    [].slice.call(document.querySelectorAll('.stage *')).forEach(function(el){
      if(el.children.length) return;
      var t=(el.textContent||'').trim();
      if(!/^\d\s*(,\s*\d)*\s*부?(반)?$/.test(t)) return;
      var s=getComputedStyle(el);
      var k=t+'|'+String(el.className).trim();
      if(m[k]) return; m[k]=1;
      o.push('     "'+t+'" ['+String(el.className).trim()+'] 바탕'+s.backgroundColor
        +(green(s.backgroundColor)?'  ← 초록':''));
    });
  }catch(e){ o.push('터짐 '+e.message+' @'+(e.stack||'').split('\n')[1]); }
  document.getElementById('PROBE').textContent=o.join('\n');
},1500);
</script>
