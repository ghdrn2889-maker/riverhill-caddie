<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
function tap(el){ if(!el) return false; el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})); return true; }
function q(s){ return document.querySelector(s); }
function qa(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function absBtn(t){ return qa('#sheet button').filter(function(b){return b.getAttribute('data-abs')===t;})[0]; }
function where(n){
  var out=[];
  DAY.forEach(function(p){ active(p).forEach(function(r,i){ if(r.n===n) out.push(p.name+' '+(i+1)+'번'); }); });
  return out.length? out.join(' · ') : '(자리 없음)';
}
function seat(pk,i){ var a=active(part(pk)); return a[i]? a[i].n : '(빈칸)'; }
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  try{
    // ── 먼저 순번을 세운다
    setView('work');
    var sb=seonbal();
    L('선발', sb);
    applyLineup(sb, ['1','2']);
    L('세운 뒤 어긋남 줄', q('.drift:not(.newd)')? '있음(문제)':'없음 ◎');

    var victim=seat('1',5), below=seat('1',6), n1=part('1').roster.length, off0=OFFDUTY.length;
    L('과녁', victim+' = 1부 6번 · 그 아래 7번 = '+below);

    // ── ① 자리에 선 사람에게 근태를 붙일 수 있나
    openPerson(victim);
    L('사람 창', q('#sheet .st').textContent
      + ' · 근태 단추 [' + qa('#sheet button[data-abs]').map(function(b){return b.textContent;}).join(' ') + ']');
    L('  안내', q('#sheet .dnote:last-of-type')? qa('#sheet .dnote').pop().textContent : '없음');

    tap(absBtn('휴무'));
    L('휴무 붙인 뒤 자리', where(victim));
    L('  1부 6번', seat('1',5)+' (아래가 당겨졌나: '+(seat('1',5)===below?'예 ◎':'아니오 ✗')+')');
    L('  1부 명단', n1+'명 → '+part('1').roster.length+'명');
    L('  제외인원', off0+'명 → '+OFFDUTY.length+'명 · 포함 '+(OFFDUTY.indexOf(victim)>=0?'◎':'✗'));
    L('  기록', LOG[0].msg);

    // ── ② 어긋남 줄
    tap(q('.close')); setView('work');
    var ok0 = lineupPlan(seonbal(),['1','2']).moved===0;
    L('어긋남 줄', (q('.drift:not(.newd)')?'뜸':'안 뜸')+' · 순번은 '+(ok0?'맞음':'어긋남')
      + ' → ' + ((!q('.drift:not(.newd)') && ok0)||(q('.drift:not(.newd)') && !ok0) ? '말이 맞음 ◎' : '말이 어긋남 ✗')
      + '  (자리 비우기가 이미 순번을 지켜 주면 아무 말도 안 한다)');

    // 배지 있던 사람(중복 근무)도 빠지면 뒤가 당겨지나
    var v2=seat('2',3), n2=part('2').roster.length;
    openPerson(v2); tap(absBtn('병가')); tap(q('.close')); setView('work');
    L('중복 근무자 병가', v2+' · 2부 명단 '+n2+'→'+part('2').roster.length
      + ' · 기록 '+LOG[0].msg);
    L('  ▶ 대조', (function(){ var pl=lineupPlan(seonbal(),['1','2']);
        var add=pl.slots.filter(function(x){return x.add;}).length;
        return add? '빈 티오프 '+add+'칸 — 세울 것이 있음 ◎'
                  : (pl.moved? '어긋남 ✗':'그 차례대로 섰음 ◎'); })());
    L('  휴무·병가 근무칸 침범', (function(){
        var bad=[];
        DAY.forEach(function(p){ active(p).forEach(function(r,i){
          if(i<p.tees.length && isAbs(tagOf(r.n))) bad.push(p.name+' '+(i+1)+'번 '+r.n); }); });
        return bad.length? bad.join(' / ')+' ✗' : '없음 ◎';
      })());

    // ── ③ 배지를 떼면 돌아오나
    openPerson(victim);
    L('돌아오기 단추', qa('#sheet button[data-abs]').map(function(b){return b.textContent;}).join(' '));
    tap(absBtn(''));
    L('근무로 되돌림', where(victim)+' · 제외인원 포함 '+(OFFDUTY.indexOf(victim)>=0?'예(문제)':'아니오 ◎'));
    L('  배지', tagOf(victim)===''? '없음 ◎' : tagOf(victim));

    tap(q('.close')); setView('work');
    L('돌아온 뒤 어긋남', q('.drift:not(.newd)')? '있음 ◎ · '+q('.drift .dt').textContent : '없음(문제)');
    var pre=[0,1,2,3,4,5,6].map(function(i){return seat('1',i);}).join(',');
    tap(qa('.drift:not(.newd) .dbtn button')[0]); setView('work');
    L('다시 세우기', q('#toast').textContent);
    L('  1부 앞 7자리', pre+'  →  '+[0,1,2,3,4,5,6].map(function(i){return seat('1',i);}).join(','));
    L('  '+victim, where(victim));
    L('  어긋남 줄', q('.drift:not(.newd)')? '남음(문제)':'사라짐 ◎');
    L('  ▶ 대조', lineupPlan(seonbal(),['1','2']).moved===0?'그 차례대로 섰음 ◎':'어긋남 ✗');

    // ── ④ 되돌리기로 통째 복구되나
    var st=[]; for(var k=0;k<6;k++) st.push(where('_'));
    undo(); undo(); undo(); undo();
    setView('work');
    L('되돌리기 4번', '1부 6번 '+seat('1',5)+' · 명단 '+part('1').roster.length+'명 · '+victim+' '+where(victim));
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},900);
</script>
