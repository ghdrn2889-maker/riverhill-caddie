<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function ok(c,k,v){ o.push((c?'◎ ':'✗ ')+k+': '+v); }
  function tap(el){ if(!el) return false;
    el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})); return true; }
  function sh(){ return document.getElementById('sheet'); }
  function heads(){ return [].slice.call(sh().querySelectorAll('.grp h4'))
    .map(function(h){ return h.textContent.trim(); }); }
  function grp(t){ return [].slice.call(sh().querySelectorAll('.grp')).filter(function(g){
    var h=g.querySelector('h4'); return h && h.textContent.trim()===t; })[0]||null; }
  function tabs(){ var g=grp('부 선택'); return g? [].slice.call(g.querySelectorAll('.acts.pm button')):[]; }
  function bg(b){ var c=getComputedStyle(b); return c.backgroundColor; }
  function stBtns(){ var g=grp('상태'); return g? [].slice.call(g.querySelectorAll('.acts button')):[]; }
  function stOn(){ return stBtns().filter(function(b){ return b.classList.contains('on'); })
    .map(function(b){ return b.textContent.trim(); }); }
  function byTx(t){ return stBtns().filter(function(b){ return b.textContent.trim()===t; })[0]; }
  try{
    localStorage.clear(); resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen();
    DAY.forEach(function(p){ p.roster=[]; }); OFFDUTY=JONAMES.slice(); PLAN={}; ABSFROM={};
    applyLineup(seonbal(), ['1','2']); applyLineup(bu3Start(), ['3']);
    paint();

    var who = JONAMES.filter(function(n){ return partsOf(n).join(',')==='1' && !tagOf(n) && !isBu3(n); })[0];
    openPerson(who);
    L('고른 사람', who + ' · 자리 ' + (partsOf(who).join(',')||'-'));

    L('','★갑. 묶음 이름');
    L('  머리말', heads().join(' / '));
    ok(heads().indexOf('오늘 근무')>=0, "  '오늘 어디 있나' → '오늘 근무'", heads()[0]);
    ok(heads().indexOf('부 선택')>=0, "  '부 선택'", '있음');
    ok(heads().indexOf('상태')>=0, "  '상태'", '있음');
    ok(heads().indexOf('그날의 구분')<0 && heads().indexOf('오늘 근태')<0,
       '  옛 묶음 둘', '없음 ◎');

    L('','★을. 부 선택 칸 — 이름만, 색으로');
    ok(tabs().length===DAY.length, '  칸 수', tabs().length+'개');
    ok(tabs().every(function(b){ return /^\d+부$/.test(b.textContent.trim()); }),
       '  칸 글은 이름뿐', tabs().map(function(b){ return b.textContent.trim(); }).join(' '));
    ok(!/배치표에 있음|안 함/.test(grp('부 선택').textContent), '  옛 문구', '없음 ◎');
    ok(!/여기서 정하는 것은/.test(sh().textContent), '  긴 설명 문구', '없음 ◎');
    L('  1부 바탕(끄기 전)', bg(tabs()[0]));
    tap(tabs()[0]); 
    ok(/rgb\(180, 86, 110\)/.test(bg(tabs()[0])), '  누르면 1부 장미색', bg(tabs()[0]));
    ok(inPlan(who,'1'), '  기계 쪽 PLAN', planOf(who).join(',')||'-');
    tap(tabs()[0]);
    ok(/rgb\(255, 255, 255\)/.test(bg(tabs()[0])) && !inPlan(who,'1'),
       '  다시 누르면 흰 바탕', bg(tabs()[0]));
    ok(/배치표 자리/.test(grp('부 선택').textContent), '  배치표 자리 줄', '있음');

    L('','★병. 상태 — 근태와 구분이 한 묶음');
    L('  단추', stBtns().map(function(b){ return b.textContent.trim(); }).join(' '));
    ok(stBtns().length===1+DAYTAGS.length+ABSTYPES.length, '  단추 수',
       stBtns().length+'개 (근무1 + 구분'+DAYTAGS.length+' + 근태'+ABSTYPES.length+')');
    ok(stOn().join(',')==='근무', '  지금 켜진 것', stOn().join(',')||'(없음)');

    L('','★정. 조출을 누르면');
    tap(byTx('조출'));
    L('  ', who+' 배지['+(tagOf(who)||'-')+'] 자리['+(partsOf(who).join(',')||'-')+']');
    ok(stOn().join(',')==='조출', '  켜진 것', stOn().join(',')||'(없음)');

    L('','★무. 새 사람으로 — 휴무를 누르면 자리를 비운다');
    var w2 = JONAMES.filter(function(n){ return partsOf(n).join(',')==='1' && !tagOf(n) && !isBu3(n); })[0];
    openPerson(w2);
    L('  고른 사람', w2 + ' 자리[' + (partsOf(w2).join(',')||'-') + ']');
    tap(byTx('휴무'));
    L('  ', w2+' 배지['+(tagOf(w2)||'-')+'] 자리['+(partsOf(w2).join(',')||'-')+']');
    ok(stOn().join(',')==='휴무', '  켜진 것', stOn().join(',')||'(없음)');
    ok(!partsOf(w2).length, '  자리를 비웠나', partsOf(w2).join(',')||'(없음) ◎');

    L('','★기. 근무를 누르면 자리가 돌아온다');
    tap(byTx('근무'));
    L('  ', w2+' 배지['+(tagOf(w2)||'-')+'] 자리['+(partsOf(w2).join(',')||'-')+']');
    ok(stOn().join(',')==='근무', '  켜진 것', stOn().join(',')||'(없음)');
    ok(partsOf(w2).join(',')==='1', '  자리가 돌아왔나', partsOf(w2).join(',')||'★안 돌아옴');

    L('','★경. 쉬는 중에 구분을 누르면 막는가 (예전 규칙 그대로)');
    tap(byTx('병가'));
    var t1 = tagOf(w2);
    tap(byTx('조출'));
    ok(tagOf(w2)===t1, '  병가가 지켜지나', tagOf(w2));
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length?E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},1500);
</script>
