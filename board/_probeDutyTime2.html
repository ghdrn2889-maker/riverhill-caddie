<div id="PROBE"></div>
<script>
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function row(n){ return workRows().filter(function(x){ return x.n===n; })[0]; }
  function say(n){ var r=row(n); return '['+r.bts.join(' ')+'] '+r.st+' (cls '+r.cls+')'; }
  try{
    localStorage.clear(); CARRY.seats=true; resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen(); setView('work'); paint();
    var W=workRows().filter(function(r){ return r.cls==='w'; });
    var A=W[0].n,B=W[1].n,C=W[2].n,D=W[3].n;
    [A,B,C,D].forEach(function(n){ vacateSeats(n); });

    // ㉠ 하루를 다 덮는 당번 6:00~22:00
    if (DUTYKEYS.indexOf('종일 당번')<0){ DUTYKEYS.push('종일 당번'); DUTY['종일 당번']=[]; DUTYDEF['종일 당번']={t:'6:00',h:16}; }
    dutyToggle('종일 당번', A);
    // ㉡ 프리인데 당번도 있음
    setDayTag(B,'프리'); dutyToggle('당번', B);
    // ㉢ 조출인데 벌당(오후)
    setDayTag(C,'조출'); dutyToggle('벌당', C);
    // ㉣ 당번 없이 그냥 프리
    setDayTag(D,'프리');
    paint();
    L('㉠ 종일 당번 6:00~22:00', A+' '+say(A)+'  ← 당번 중이어야');
    L('㉡ 프리 + 당번(7시)   ', B+' '+say(B)+'  ← 프리라서 자리 없음이어야');
    L('㉢ 조출 + 벌당(13시)  ', C+' '+say(C)+'  ← 아침은 뛸 수 있으니 미배치여야');
    L('㉣ 그냥 프리          ', D+' '+say(D)+'  ← 자리 없음이어야');
    var t=workTally();
    L('', ''); L('셈', '총원 '+t.total+' · 가용 '+t.avail+' · 제외 '+t.exc);
    // 라운드 길이를 바꾸면 따라오나
    setRoundMin(120); paint();
    L('', ''); L('한 라운드를 2시간으로 줄이면', '㉢ '+say(C)+' · ㉠ '+say(A));
  }catch(e){ o.push('터짐 '+e.message+' @'+(e.stack||'').split('\n')[1]); }
  document.getElementById('PROBE').textContent=o.join('\n');
},1300);
</script>
