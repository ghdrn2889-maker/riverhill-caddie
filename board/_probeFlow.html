<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function shape(){ return DAY.map(function(p){
    var a=active(p), named=a.filter(function(r){return r.n;}).length, wait=0;
    for(var i=p.tees.length;i<a.length;i++) if(a[i].n) wait++;
    return p.name+' 팀'+p.tees.length+' 이름'+named+' 대기'+wait; }).join(' | '); }
  function head(pk,n){ var p=part(pk),a=active(p),s=[];
    for(var i=0;i<Math.min(n,a.length);i++)
      s.push(seatNo(p,i)+'.'+(a[i].n||'(빔)')+(i<p.tees.length?'':'*'));
    return s.join(' '); }
  function blank(){                       // 매일 아침 — 팀도 사람도 없는 판
    DAY.forEach(function(p){ p.roster=[]; p.tees=[]; });
    OFFDUTY = JONAMES.slice(); ABSFROM={}; dirty={};
  }
  try{
    localStorage.clear(); CARRY.seats=true; resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen(); setView('board'); paint();
    L('후보', '하우스 '+lineupPool('house').length+'명 · 3부반 '+lineupPool('bu3').length+'명');

    // ㉠ 팀을 하나도 안 넣고 순번 세우기
    blank(); paint();
    applyLineup(seonbal(), ['1','2']); applyLineup(bu3Start(), ['3']); paint();
    L('', ''); L('㉠ 팀 0개인 채로 순번 세우기', shape());
    L('   1부 앞', head('1',5) || '(빔)');
    L('   2부 앞', head('2',5));
    L('   3부 앞', head('3',5));
    L('   1부에 스페어가', active(part('1')).filter(function(r){return r.n;}).length ? '★있다' : '없다 ◎');

    // ㉡ 1부에만 팀 10개를 넣고 순번 세우기
    blank();
    for (var i=0;i<10;i++) addTeam('1', hm(mm('6:44')+i*7), 'OUT');
    paint();
    applyLineup(seonbal(), ['1','2']); paint();
    L('', ''); L('㉡ 1부에만 팀 10개', shape());
    L('   1부', head('1',12));
    L('   2부 앞', head('2',6));
    L('   1부에 대기가', (function(){ var p=part('1'),a=active(p),w=0;
      for(var i=p.tees.length;i<a.length;i++) if(a[i].n) w++; return w? '★'+w+'명':'없다 ◎'; })());

    // ㉢ 1부 10팀 + 2부 5팀
    blank();
    for (i=0;i<10;i++) addTeam('1', hm(mm('6:44')+i*7), 'OUT');
    for (i=0;i<5;i++)  addTeam('2', hm(mm('11:50')+i*7), 'OUT');
    paint();
    applyLineup(seonbal(), ['1','2']); paint();
    L('', ''); L('㉢ 1부 10팀 + 2부 5팀', shape());
    L('   1부', head('1',12));
    L('   2부', head('2',10));
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length?E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},1400);
</script>
