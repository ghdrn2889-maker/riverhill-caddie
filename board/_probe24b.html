<div id="PROBE"></div>
<script>
var ERRS=[]; window.addEventListener('error',function(e){ERRS.push(e.message+' @'+e.lineno);});
(function(){
  var out=[]; function log(k,v){out.push(k+': '+v);}
  function fire(el,v){el.value=v;el.dispatchEvent(new Event('change',{bubbles:true}));}
  function act(n){var bs=document.querySelectorAll('#sheet button');
    for(var i=0;i<bs.length;i++)if(bs[i].getAttribute('data-act')===n)return bs[i];return null;}
  function tees(pk){var a=[],ts=document.querySelectorAll('#col'+pk+' .brow .tm');
    for(var i=0;i<ts.length;i++)a.push(ts[i].textContent.trim().replace(/\s+/g,''));return a.slice(0,8).join(' ');}
  try{
    log('type=time 남은 것', document.querySelectorAll('input[type=time]').length);
    // 경기과 자리 — 이제 칸도 다듬어져야 한다
    openSlot('staff',3);
    fire(document.getElementById('slotTime'),'530');
    log('경기과 530 →', document.getElementById('slotTime').value);
    act('slotsave').click();
    log('경기과 저장', document.querySelectorAll('#staffBox .slot .tm2')[3].textContent);
    // 티오프
    log('2부 처음', tees('2'));
    openCell('2',1);
    var st=document.getElementById('shTime');
    fire(st,'1155');
    log('티오프칸 1155 →', st.value);
    act('time').click();
    log('2부 뒤', tees('2'));
    // 팀 추가 — 격자 밖
    openAddTeam('2');
    var at=document.getElementById('adTime');
    log('추가칸 기본', at.value);
    fire(at,'1402');
    (function(){var bs=document.querySelectorAll('#sheet button');
      for(var i=0;i<bs.length;i++)if(bs[i].getAttribute('data-act')==='addteam'){bs[i].click();return;}})();
    log('추가 뒤', tees('2'));
    log('errs', ERRS.join(' | ')||'none');
  }catch(e){out.push('ERROR: '+e.message+' | '+(e.stack||'').split('\n')[1]);}
  document.getElementById('PROBE').textContent=out.join('  ;;  ');
})();
</script>
