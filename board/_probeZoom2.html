<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function nm(el){ if(!el) return '-';
    return el.tagName.toLowerCase()+(el.id?'#'+el.id:'')+
      (el.className&&typeof el.className==='string'?'.'+el.className.trim().split(/\s+/).slice(0,2).join('.'):''); }
  function vis(el){ var s=getComputedStyle(el);
    if(s.display==='none'||s.visibility==='hidden'||s.opacity==='0') return false;
    var r=el.getBoundingClientRect(); return r.width>1&&r.height>1; }
  function R(el){ return el.getBoundingClientRect(); }
  function scan(tag){
    var out=[],clip=[],all=document.querySelectorAll('.stage *');
    for(var i=0;i<all.length;i++){ var el=all[i]; if(!vis(el)) continue; var r=R(el);
      if(r.bottom>innerHeight+1||r.right>innerWidth+1||r.top<-1||r.left<-1){
        var p=el.parentNode,ins=false;
        while(p&&p.nodeType===1){ var s=getComputedStyle(p);
          if(/auto|scroll/.test(s.overflowY+s.overflowX)){ins=true;break;} p=p.parentNode; }
        if(!ins) out.push(nm(el)+'['+Math.round(r.width)+'x'+Math.round(r.height)+' b'+Math.round(r.bottom)+']'); }
      var cs=getComputedStyle(el);
      if((cs.overflow==='hidden'||cs.overflowY==='hidden')&&el.clientHeight>0&&el.scrollHeight-el.clientHeight>3)
        clip.push(nm(el)+'(+'+(el.scrollHeight-el.clientHeight)+')');
    }
    var bad=[];
    function sib(root){ var kids=[].slice.call(root.children).filter(vis);
      for(var a=0;a<kids.length;a++) for(var b=a+1;b<kids.length;b++){
        var A=R(kids[a]),B=R(kids[b]);
        var ox=Math.min(A.right,B.right)-Math.max(A.left,B.left);
        var oy=Math.min(A.bottom,B.bottom)-Math.max(A.top,B.top);
        if(ox>2&&oy>2) bad.push(nm(kids[a])+'×'+nm(kids[b])+'('+Math.round(ox)+'x'+Math.round(oy)+')'); } }
    [].slice.call(document.querySelectorAll('.stage .hd .top,.stage .savebar,.stage .bstrip,.stage .ph,.stage .wrow,.stage .brow,.stage .slot,.stage .drow,.stage .crow,.stage .johd,.stage .sumgrid,.stage .wkfoot'))
      .slice(0,120).forEach(sib);
    L('['+tag+']','밖 '+(out.length?out.length+'개 '+out.slice(0,5).join(' '):'0')
      +' / 겹침 '+(bad.length?bad.length+'개 '+bad.slice(0,5).join(' '):'0')
      +' / 잘림 '+(clip.length?clip.length+'개 '+clip.slice(0,5).join(' '):'0'));
  }
  try{
    localStorage.clear(); CARRY.seats=true; resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen(); paint();
    L('창', innerWidth+'x'+innerHeight);
    setView('board'); if(typeof fit==='function') fit(); paint();
    L('  --k', getComputedStyle(document.documentElement).getPropertyValue('--k').trim());
    scan('배치표');
    setView('work'); paint(); scan('근무표');
    setView('board'); paint();
    openDrawer && openDrawer('3');
    var d=document.querySelector('.drw.on'); if(d){ var r=R(d);
      L('[서랍]', Math.round(r.width)+'x'+Math.round(r.height)+(r.bottom>innerHeight+1?' 밖으로':' ◎')); }
    document.querySelectorAll('.drw').forEach(function(x){x.classList.remove('on');});
    if (typeof openCfg==='function'){ openCfg(); paint(); scan('설정'); }
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length?E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},1400);
</script>
