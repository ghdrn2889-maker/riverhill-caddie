<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function ok(c,k,v){ o.push((c?'◎ ':'✗ ')+k+': '+v); }
  function cellOf(pk,n){
    var out=null;
    [].slice.call(document.querySelectorAll('#cols .cell[data-nm]')).forEach(function(c){
      if(c.getAttribute('data-nm')!==n) return;
      if(c.getAttribute('data-pk')!==pk) return;
      if(!out) out=c;
    });
    if(!out) return null;
    return { cls: out.className.replace(/\s+/g,'.'),
             tags: [].slice.call(out.querySelectorAll('.tag')).map(function(t){
               return t.className.replace(/\s+/g,'.')+'="'+t.textContent.trim()+'"'; }).join(' ') };
  }
  function say(pk,n){ var c=cellOf(pk,n); return c? c.cls+'  ['+(c.tags||'배지 없음')+']' : '(칸 없음)'; }
  function wk(n){
    var r=document.querySelector('#workTable [data-who="'+n+'"]');
    if(!r) return '(줄 없음)';
    return [].slice.call(r.children).map(function(e){
      var t=e.textContent.trim(); return t? e.className.replace(/\s+/g,'.')+'="'+t+'"':''; })
      .filter(Boolean).join('  ');
  }
  function reset(){
    localStorage.clear(); resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen();
    DAY.forEach(function(p){ p.roster=[]; }); OFFDUTY=JONAMES.slice(); ABSFROM={}; PLAN={};
  }
  try{
    reset();
    var B3=JONAMES.filter(function(n){ return isBu3(n); })[0];
    var N =JONAMES.filter(function(n){ return !isBu3(n); })[0];
    L('3부반 사람', B3); L('그냥 사람', N);

    // ── 갑. 3부반 사람을 2부 칸에 앉힌다
    o.push(''); L('★갑. 3부반 사람을 2부에 앉힌다','');
    seatPerson('2',0,B3); setView('board'); paint();
    var c=cellOf('2',B3);
    L('  2부 칸', say('2',B3));
    ok(c && c.cls.indexOf('c3b')<0, '  보라 바탕(c3b)', c? (c.cls.indexOf('c3b')<0?'없음 ◎':'★아직 있다') : '★칸 없음');
    ok(c && !/3부/.test(c.tags), '  3부 배지', c? (/3부/.test(c.tags)?'★아직 붙는다':'없음 ◎') : '★칸 없음');

    // ── 을. 근무표에서는 소속이 그대로 보여야 한다
    setView('work'); paint();
    o.push(''); L('★을. 근무표 줄(소속은 여기서 말한다)','');
    L('  '+B3, wk(B3));
    ok(/3부반/.test(wk(B3)), '  3부반 배지', /3부반/.test(wk(B3))?'그대로 ◎':'★사라졌다');

    // ── 병. 같은 사람을 3부에도 앉히면 2,3
    o.push(''); L('★병. 3부에도 앉힌다 → 2,3','');
    seatPerson('3',0,B3); setView('board'); paint();
    L('  2부 칸', say('2',B3));
    L('  3부 칸', say('3',B3));
    var c2=cellOf('2',B3), c3=cellOf('3',B3);
    ok(c2 && c2.cls.indexOf('c23')>=0, '  2부 칸 바탕', c2? c2.cls : '★없음');
    ok(c3 && c3.cls.indexOf('c23')>=0, '  3부 칸 바탕', c3? c3.cls : '★없음');
    ok(c2 && /tag\.tc23="2,3"/.test(c2.tags), '  2부 칸 배지', c2? c2.tags : '★없음');
    ok(c2 && c3 && c2.cls.replace(/\.(dirty|pick)/g,'')===c3.cls.replace(/\.(dirty|pick)/g,''),
       '  두 칸이 같은 색', (c2?c2.cls:'')+' / '+(c3?c3.cls:''));

    // ── 정. 54 도 배지에 색이 드나
    reset();
    o.push(''); L('★정. 세 부에 다 앉히면 54','');
    seatPerson('1',0,N); seatPerson('2',0,N); seatPerson('3',0,N);
    setView('board'); paint();
    L('  1부 칸', say('1',N));
    var c1=cellOf('1',N);
    ok(c1 && /tag\.tc54="54"/.test(c1.tags), '  54 배지 색', c1? c1.tags : '★없음');

    // ── 무. 조출도
    reset();
    o.push(''); L('★무. 조출 배지','');
    setDayTag(N,'조출'); seatPerson('1',0,N);
    setView('board'); paint();
    L('  1부 칸', say('1',N));
    var cj=cellOf('1',N);
    ok(cj && /tag\.tcjo/.test(cj.tags) && cj.cls.indexOf('cjo')>=0, '  조출 바탕+배지', cj? cj.cls+' '+cj.tags : '★없음');

    // ── 기. 3부반 사람이 3부 칸에 있을 때도 '3부' 글씨가 없어야
    reset();
    o.push(''); L('★기. 3부반 사람을 3부 칸에','');
    seatPerson('3',0,B3); setView('board'); paint();
    L('  3부 칸', say('3',B3));
    var cb=cellOf('3',B3);
    ok(cb && !/3부/.test(cb.tags), '  3부 글씨', cb? (/3부/.test(cb.tags)?'★아직 있다':'없음 ◎') : '★칸 없음');
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length?E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},1500);
</script>
