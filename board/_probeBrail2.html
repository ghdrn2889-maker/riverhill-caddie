<div id="PROBE"></div>
<script>
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  try{
    setView('board'); paint();
    var b=document.querySelector('.body');
    L('.body 몇 개', document.querySelectorAll('.body').length);
    L('지금 칸', getComputedStyle(b).gridTemplateColumns);
    L('--k 날것', '"'+getComputedStyle(document.documentElement).getPropertyValue('--k')+'"');
    b.style.gridTemplateColumns='repeat(3,minmax(0,1fr)) 340px';
    L('340px 로 박으면', getComputedStyle(b).gridTemplateColumns);
    b.style.gridTemplateColumns='repeat(3,minmax(0,1fr)) calc(340px*var(--k))';
    L('calc 로 하면', getComputedStyle(b).gridTemplateColumns);
    b.style.gridTemplateColumns='';
    var r=document.getElementById('brail');
    L('brail 부모', r.parentNode.className);
    L('brail grid-column', getComputedStyle(r).gridColumnStart+' / '+getComputedStyle(r).gridColumnEnd);
    L('.body 규칙 몇 개 먹나', (function(){
      var n=0; for (var i=0;i<document.styleSheets.length;i++){
        var rs; try{ rs=document.styleSheets[i].cssRules; }catch(e){ continue; }
        for (var j=0;j<rs.length;j++){
          if (rs[j].selectorText === '.body') n++;
          if (rs[j].cssRules) for (var m=0;m<rs[j].cssRules.length;m++)
            if (rs[j].cssRules[m].selectorText === '.body') n+=100;
        } }
      return n; })());
  }catch(e){ o.push('터짐: '+e.message); }
  document.getElementById('PROBE').textContent=o.join('\n');
},1200);
</script>
