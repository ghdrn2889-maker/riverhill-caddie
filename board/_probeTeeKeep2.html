<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
function reset(){
  localStorage.clear(); CARRY.seats=true; resetToBoard(); DATE=BOARD.date;
  savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
  bootLoad(); caughtSeen();
}
function idxAt(p, tm){ var a=[]; p.tees.forEach(function(t,k){ if (t.time===tm) a.push(k); }); return a; }
function rowsOn(){ setView('board'); paint();
  return document.querySelectorAll('#col1 .brow:not(.spare)').length; }
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function ok(c,k,v){ o.push((c?'◎ ':'✗ ')+k+': '+v); }
  try{
    L('','★갑. 본배치표가 들고 온 길이');
    reset();
    L('  BOARDROWS', JSON.stringify(BOARDROWS) + ' · ROWS ' + ROWS);
    var p = part('1');
    L('  1부', p.start + ' ~ ' + p.tees[p.tees.length-1].time
      + ' · 격자 ' + gridTimes(p).length + '칸 · 화면 ' + rowsOn() + '줄');

    // ── 을. 마지막 시각 팀을 전부 지우고 → 저장 → 다시 열기
    L('','★을. 지우고 · 저장 · 다시 열기');
    p = part('1');
    var g0 = gridTimes(p), lastT = g0[g0.length-1];
    delTeams('1', idxAt(p, lastT));
    L('  지운 직후', gridTimes(part('1')).length + '칸 · 화면 ' + rowsOn() + '줄');
    daySave(); bootLoad();
    var g1 = gridTimes(part('1'));
    L('  다시 연 뒤', g1.length + '칸 · ' + g1[0] + ' ~ ' + g1[g1.length-1]
      + ' · 화면 ' + rowsOn() + '줄');
    ok(g1.indexOf(lastT) >= 0, '  ★' + lastT + ' 칸이 남나', g1.indexOf(lastT)>=0?'남음 ◎':'★사라짐');

    // ── 병. 고치기 전에 이미 잃은 판을 흉내낸다 (자국 없이 짧은 채로 저장된 판)
    L('','★병. 옛날에 잃은 판을 열면');
    reset();
    p = part('1');
    var want = gridTimes(p).length;
    // 끝 시각 팀을 지운 뒤 자국을 지워 '옛 저장본'을 만든다
    delTeams('1', idxAt(p, gridTimes(p)[gridTimes(p).length-1]));
    delete part('1').rows;
    daySave();
    // 저장본에서 자국을 빼고 다시 넣는다
    var key = Object.keys(localStorage).filter(function(k){ return k.indexOf('day.') >= 0; })[0];
    if (key){
      var raw = localStorage.getItem(key), o2 = JSON.parse(raw), st = JSON.parse(o2.s);
      st.day.forEach(function(q){ delete q.rows; });
      o2.s = JSON.stringify(st); localStorage.setItem(key, JSON.stringify(o2));
    }
    bootLoad();
    var g2 = gridTimes(part('1'));
    L('  자국 없는 옛 저장본', g2.length + '칸 · ' + g2[0] + ' ~ ' + g2[g2.length-1]
      + ' · 화면 ' + rowsOn() + '줄');
    ok(g2.length === want, '  ★잃었던 칸이 돌아오나', want + '칸 기대 · ' + g2.length + '칸');

    // ── 정. 3부도 그대로인가
    L('','★정. 3부');
    var q = part('3');
    L('  3부', gridTimes(q).length + '칸 · BOARDROWS ' + BOARDROWS['3']);
    delTeams('3', idxAt(q, gridTimes(q)[gridTimes(q).length-1]));
    L('  마지막 지운 뒤', gridTimes(part('3')).length + '칸');
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},1400);
</script>
