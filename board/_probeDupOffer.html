<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function seatOf(pk,nm){ var p=part(pk),a=active(p);
    for(var i=0;i<a.length;i++) if(a[i].n===nm) return seatNo(p,i); return 0; }
  function groups(pk,i){ openCell(pk,i);
    return [].slice.call(document.getElementById('sheet').querySelectorAll('[data-sg]'))
      .map(function(b){ return b.textContent; }); }
  function tot(){ var t=0; DAY.forEach(function(p){ active(p).forEach(function(r){ if(r.n) t++; }); }); return t; }
  try{
    localStorage.clear(); CARRY.seats=true; resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen(); setView('board'); paint();

    // ★사용자가 한 그대로 — 2부 사람을 3부에도 넣어 2·3 근무자 넷을 만든다
    var who = active(part('2')).filter(function(r){ return r.n && !r.itn; })
      .slice(0,4).map(function(r){ return r.n; });
    who.forEach(function(n){ if (partsOf(n).indexOf('3')<0) addRow('3', n); });
    L('만든 2·3 근무자', who.map(function(n){ return n+':'+partsOf(n).join(',')+'['+(tagOf(n)||'-')+']'; }).join(' '));
    L('  다시 지정해도(같은 값)', (function(){ who.forEach(function(n){ setDayTag(n,'2,3'); });
      return who.map(function(n){ return n+'['+(tagOf(n)||'떨어짐')+']'; }).join(' '); })());

    L('', '');
    L('★2부 1번 칸', groups('2',0).join(' / ') || '없음');
    L('★3부 1번 칸', groups('3',0).join(' / ') || '없음');
    L('★1부 1번 칸', groups('1',0).join(' / ') || '없음  ← 2,3 은 1부가 아니니 맞다');

    var tot0 = tot(), before3 = who.map(function(n){ return seatOf('3',n); }).join(',');
    L('  3부에서 지금 번호', before3);
    // 3부 1번 칸에서 눌러 본다
    var gb = [].slice.call(document.getElementById('sheet').querySelectorAll('[data-sg]'));
    openCell('3',0);
    gb = [].slice.call(document.getElementById('sheet').querySelectorAll('[data-sg]'));
    if (gb.length){
      gb[0].click();
      L('', '');
      L('★3부 1번부터 눌렀더니', who.map(function(n){ return n+':'+seatOf('3',n); }).join(' '));
      var g = who.map(function(n){ return seatOf('3',n); }).sort(function(a,b){return a-b;});
      L('  번호', g.join(',') + (g.join(',')==='1,2,3,4' ? ' ◎ 1~4 연달아' : ' 어긋남'));
      L('  배치표 전체', tot0 + ' → ' + tot() + (tot()===tot0 ? ' ◎ 안 늘었다(옮긴 것)' : ' 늘었다 — 중복이 또 생겼다'));
      L('  2부 자리 지켰나', who.every(function(n){ return seatOf('2',n); }) ? '◎ 넷 다 2부에도 그대로' : '2부 자리를 잃음');
      L('  기록', LOG[0]?LOG[0].msg:'없음');
      var st = allPeople().filter(function(n){ return !dayMark(n) && !isBu3(n); })[0];
      setSeonbal(st); applyLineup(st, ['1','2']); applyLineup(bu3Start(), ['3']);
      L('  순번 세운 뒤', who.map(function(n){ return n+':'+partsOf(n).join(',')+'/3부'+seatOf('3',n); }).join(' '));
    }
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},900);
</script>
