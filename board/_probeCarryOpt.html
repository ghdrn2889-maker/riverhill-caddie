<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function ok(c,k,v){ o.push((c?'◎ ':'✗ ')+k+': '+v); }
  function absN(){ return JONAMES.filter(function(n){ return isAbs(tagOf(n)); }).length; }
  function seen(){ return document.body.innerText || ''; }
  try{
    // ★옛 프로브는 '무엇을 들고 갈까' 고르개를 쟀다. 그 고르개는 없어졌다 —
    //   날 넘기기는 길이 하나뿐이고, 근태는 고를 수 없이 늘 따라온다
    localStorage.clear(); CARRY.seats = true; resetToBoard();
    savedSig=null; PENDING=null; CAUGHT=null; DATE=BOARD.date;
    bootLoad();
    var c = caughtRead();
    L('켤 때 저절로 만든 날', c ? (c.from + ' → ' + c.to) : '(안 만듦)');
    L('  그때 근태', absN() + '명');
    caughtSeen();
    if (typeof setView === 'function') setView('work');
    paint();

    L('','★갑. 수동 넘기기는 없다');
    ok(!document.querySelector('[data-act="nday"]'), '  넘기기 단추', '없음');
    ok(typeof openCarry === 'undefined', '  넘기기 확인 창', '없어짐');
    ok(typeof carryOptsHTML === 'undefined', '  고르개', '없어짐');
    ok(seen().indexOf('내일로 넘기기') < 0, '  화면 글자', '없음');

    L('','★을. 근태는 고를 수 없이 늘 따라온다');
    ok(keepOnCarry('휴무') === true, '  휴무', keepOnCarry('휴무'));
    ok(keepOnCarry('휴가') === true, '  휴가', keepOnCarry('휴가'));
    ok(keepOnCarry('병가') === true, '  병가', keepOnCarry('병가'));
    ok(keepOnCarry('휴무', { abs: false, leave: false }) === true,
       '  ★설정을 꺼 놔도 따라온다', keepOnCarry('휴무', { abs: false, leave: false }));
    ok(keepOnCarry('조출') === false, '  그날의 구분은 안 따라온다', keepOnCarry('조출'));
    ok(keepOnCarry('당번') === false, '  당번도 안 따라온다', keepOnCarry('당번'));
    ok(keepOnCarry('3부') === true, '  3부 소속은 그대로', keepOnCarry('3부'));

    L('','★병. 실제로 넘겨 본다');
    var pool = JONAMES.filter(function(n){ return !tagOf(n); });
    var mine = { 휴무: pool.slice(0,4), 휴가: pool.slice(4,6), 병가: pool.slice(6,7) };
    Object.keys(mine).forEach(function(k){ mine[k].forEach(function(n){ setAbsent(n, k); }); });
    var was = absN();
    carryToDate(nextDateLabel(DATE), true);
    ok(absN() === was, '  근태 머릿수', was + ' → ' + absN() + '명');
    var lost = [];
    Object.keys(mine).forEach(function(k){ mine[k].forEach(function(n){ if (tagOf(n) !== k) lost.push(n); }); });
    ok(lost.length === 0, '  한 사람도 안 잃음', lost.join(' ') || '없음');
    ok(((LOG[0]||{}).msg||'').indexOf('휴무·휴가·병가는 그대로') >= 0, '  기록', (LOG[0]||{}).msg || '-');

    L('','★정. 그날치는 여전히 비운다');
    ok(JONAMES.filter(function(n){ var t = dayMark(n); return t && !isAbs(t); }).length === 0,
       '  구분(조출·후출·중복)', '0명');
  }catch(err){ o.push('✗ 터짐: ' + err.message); }
  o.push('errs: ' + (E.length? E.join(' | ') : 'none'));
  document.getElementById('PROBE').textContent = o.join('\n');
}, 900);
</script>
