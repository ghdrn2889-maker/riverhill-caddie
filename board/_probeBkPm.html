<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function ok(c,k,v){ o.push((c?'◎ ':'✗ ')+k+': '+v); }
  function tap(el){ if(!el) return false;
    el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})); return true; }
  function grp(){
    var gs=[].slice.call(document.querySelectorAll('#sheet .grp'));
    return gs.filter(function(g){ var h=g.querySelector('h4');
      return h && h.textContent.trim()==='부 선택'; })[0] || null;
  }
  function tabs(){ var g=grp(); if(!g) return [];
    return [].slice.call(g.querySelectorAll('.acts.pm button')); }
  function txt(b){ return b.textContent.trim()+'|'+(b.className||'-')
    +'|'+b.getAttribute('data-bkdo'); }
  function bg(b){ var c=getComputedStyle(b); return c.backgroundColor+' / 글씨 '+c.color; }
  function warns(){ var g=grp(); if(!g) return [];
    return [].slice.call(g.querySelectorAll('.acts button.warn')).map(function(b){
      return b.textContent.trim()+'@'+b.getAttribute('data-bkdo'); }); }
  function tabBy(name){ return tabs().filter(function(b){
    return b.textContent.trim()===name; })[0]; }
  try{
    localStorage.clear(); resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen();
    DAY.forEach(function(p){ p.roster=[]; }); OFFDUTY=JONAMES.slice(); ABSFROM={}; PLAN={};
    var A=JONAMES[0], B=JONAMES[1], C=JONAMES[2];
    L('고른 사람', A+' / '+B+' / '+C);

    bulkStart(PICKTAG); bulkTap(A); bulkTap(B); bulkTap(C);
    setPlan(A,'1',true);                 // 셋 중 하나만 1부
    seatMany('3', 1, [A]);               // 3부 배치표에 한 명
    paint(); openBulkAct();

    L('','★갑. 머리말과 칸');
    ok(!!grp(), '  머리말 "부 선택"', grp()? '있음' : '★없음');
    ok(tabs().length===DAY.length, '  칸 수', tabs().length+'개 / 부 '+DAY.length+'개');
    ok(tabs().every(function(b){ return /^\d+부$/.test(b.textContent.trim()); }),
       '  칸 글은 이름뿐', tabs().map(function(b){ return b.textContent.trim(); }).join(' '));
    ok(!/안 함|근무|배치표 \d+명/.test(tabs().map(function(b){return b.textContent;}).join('')),
       '  옛 문구 없음', '◎');
    ok(tabs().every(function(b){ return b.querySelectorAll('span').length===0; }),
       '  작은 줄 없음', '◎');

    L('','★을. 꺼진 칸은 흰 바탕');
    var t2=tabBy(part('2').name);
    ok(t2.className==='pk2', '  2부 꺼짐', txt(t2));
    L('  2부 바탕', bg(t2));
    ok(/rgb\(255, 255, 255\)/.test(bg(t2)), '  흰 바탕인가', bg(t2));

    L('','★병. 일부만 — 옅은 그 부 색');
    var t1=tabBy(part('1').name);
    ok(t1.className==='pk1 half', '  1부 반만', txt(t1));
    L('  1부 바탕', bg(t1));

    L('','★정. 누르면 그 부 색으로 찬다');
    tap(t1); t1=tabBy(part('1').name);
    ok(t1.className==='pk1 on', '  1부 켜짐', txt(t1));
    L('  1부 바탕', bg(t1));
    ok(/rgb\(180, 86, 110\)/.test(bg(t1)), '  1부 장미색', bg(t1));
    ok(/글씨 rgb\(255, 255, 255\)/.test(bg(t1)), '  흰 글씨', bg(t1));
    ok([A,B,C].every(function(n){ return inPlan(n,'1'); }), '  기계 쪽 PLAN',
       [A,B,C].map(function(n){ return n+':'+planOf(n).join(''); }).join(' '));

    L('','★무. 2부·3부도 제 색으로');
    tap(tabBy(part('2').name)); tap(tabBy(part('3').name));
    L('  2부 바탕', bg(tabBy(part('2').name)));
    L('  3부 바탕', bg(tabBy(part('3').name)));
    ok(/rgb\(53, 128, 168\)/.test(bg(tabBy(part('2').name))), '  2부 강물색', bg(tabBy(part('2').name)));
    ok(/rgb\(125, 82, 184\)/.test(bg(tabBy(part('3').name))), '  3부 보라색', bg(tabBy(part('3').name)));

    L('','★기. 다시 누르면 꺼진다');
    tap(tabBy(part('1').name)); t1=tabBy(part('1').name);
    ok(t1.className==='pk1' && /rgb\(255, 255, 255\)/.test(bg(t1)), '  1부 흰 바탕으로', txt(t1)+' · '+bg(t1));
    ok([A,B,C].every(function(n){ return !inPlan(n,'1'); }), '  기계 쪽 PLAN',
       [A,B,C].map(function(n){ return n+':'+(planOf(n).join('')||'-'); }).join(' '));

    L('','★경. 자리 빼기는 그대로 따로');
    ok(warns().length===1 && /자리 빼기@-3/.test(warns()[0]), '  3부만 뜬다', warns().join(' / '));
    tap(grp().querySelector('.acts button.warn'));
    ok(partsOf(A).indexOf('3')<0, '  누르면 자리가 빠진다', partsOf(A).join(',')||'(없음)');
    ok(warns().length===0, '  단추도 사라진다', warns().join(' / ')||'(없음)');

    L('','★신. 한꺼번에 앉히기는 없애다');
    var sh=document.getElementById('sheet');
    ok(!sh.querySelector('#bkFrom'), '  번호 치는 칸', '없음 ◎');
    ok(!/한꾸번에 앉히기|에 앉히기|번부터 앉힙니다/.test(sh.textContent),
       '  그 묶음 글', '없음 ◎');
    ok(!sh.querySelector('[data-bkdo^="s|"]'), '  그 단추', '없음 ◎');
    L('  남은 머리말', [].slice.call(sh.querySelectorAll('.grp h4'))
      .map(function(h){ return h.textContent.trim(); }).join(' / '));
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length?E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},1500);
</script>
