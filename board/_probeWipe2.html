<div id="PROBE"></div>
<script>
setTimeout(function(){
  var o=[];
  try{
    localStorage.clear(); resetToBoard(); DATE=BOARD.date;
    savedSig=null; STACK=[]; REDO=[]; LOG=[]; bootLoad(); caughtSeen(); paint();
    var P=workRows().filter(function(r){ return !tagOf(r.n)&&!isBu3(r.n); }).map(function(r){return r.n;});
    setDayTag(P[0],'휴무'); setDayTag(P[1],'휴가'); setDayTag(P[2],'병가'); setDayTag(P[3],'조출');
    paint();
    function s(){ return [P[0],P[1],P[2],P[3]].map(function(n){ return n+'='+(tagOf(n)||'없음'); }).join(' '); }
    o.push('비우기 전: '+s());
    wipeDayMarks(); paint();
    o.push('구분 비운 뒤: '+s());
    o.push('  근태 셋 살아있나: '+((tagOf(P[0])==='휴무'&&tagOf(P[1])==='휴가'&&tagOf(P[2])==='병가')?'◎':'✗'));
    o.push('  조출은 지워졌나: '+(tagOf(P[3])?'✗ 남음':'◎ 지워짐'));
  }catch(e){ o.push('터짐 '+e.message); }
  document.getElementById('PROBE').textContent=o.join('\n');
},1300);
</script>
