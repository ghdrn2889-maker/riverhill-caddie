<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function stOf(n){ return workRows().filter(function(r){ return r.n===n; })[0]; }
  try{
    localStorage.clear(); CARRY.seats = true; resetToBoard();   /* 옛 전제: 처음 배치표 그대로 */ savedSig=null; PENDING=null; CAUGHT=null; DATE=BOARD.date;
    bootLoad(); caughtSeen(); setView('work');

    // ① 소속(BU3SET)과 배지(TAG='3부')가 지금 얼마나 어긋나 있나
    var mem = bu3List();
    var withTag = mem.filter(function(n){ return tagOf(n)==='3부'; });
    var noTag   = mem.filter(function(n){ return tagOf(n)!=='3부'; });
    L('3부반 소속', mem.length + '명');
    L('  배지 3부 달고 있음', withTag.length + '명');
    L('  안 달고 있음', noTag.length + '명 — ' + noTag.map(function(n){
        return n + '[' + (tagOf(n)||'없음') + ']'; }).join(' '));

    // ② 같은 처지(3부반 · 자리 없음)인 두 사람을 만들어 나란히 놓는다
    var a = withTag.filter(function(n){ return partsOf(n).length; })[0];
    var b = mem.filter(function(n){ return n!==a && partsOf(n).length; })[1];
    // b 의 배지만 지운다 — 소속은 그대로
    delete TAG[b];
    L('두 사람', a + ' 배지="' + tagOf(a) + '" · ' + b + ' 배지="' + (tagOf(b)||'없음') + '"'
      + ' · 둘 다 3부반 ' + (isBu3(a) && isBu3(b) ? '◎':'✗'));
    partsOf(a).slice().forEach(function(k){ delFromPart(k, a); });
    partsOf(b).slice().forEach(function(k){ delFromPart(k, b); });
    var ra = stOf(a), rb = stOf(b);
    L('  둘 다 자리 뺌', a + ' 자리 ' + partsOf(a).length + ' · ' + b + ' 자리 ' + partsOf(b).length);
    L('  ▶ 붙는 배지', a + ' → "' + ra.st + '"(' + ra.cls + ')   '
      + b + ' → "' + rb.st + '"(' + rb.cls + ')'
      + (ra.st === rb.st ? '  ◎ 같다' : '  ✗ 같은 처지인데 다르다'));
    L('  ▶ 셈', a + ' ' + (ra.cls==='u'?'가용':'제외') + ' · ' + b + ' ' + (rb.cls==='u'?'가용':'제외'));

    // ③ 왜 갈리나 — 소속이 아니라 남은 배지 한 글자가 가른다
    L('갈리는 까닭', 'absCls 는 소속을 안 본다 — TAG 만 본다'
      + ' · absCls("3부")=' + absCls('3부') + ' · absCls("미배치")=' + absCls('미배치'));

    // ④ 새로 3부반으로 지정하면 배지가 붙나
    var fresh = JONAMES.filter(function(n){ return !isBu3(n) && !tagOf(n); })[0];
    setBu3(fresh, true);
    L('새로 3부반 지정', fresh + ' 소속 ' + (isBu3(fresh)?'들어감 ◎':'✗')
      + ' · 배지 "' + (tagOf(fresh)||'없음') + '" '
      + (tagOf(fresh)==='3부' ? '붙음' : '★안 붙는다 — 여기서부터 어긋난다'));
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},900);
</script>
