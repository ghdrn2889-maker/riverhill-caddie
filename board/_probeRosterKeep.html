<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function has(n){ return JONAMES.indexOf(n)>=0; }
  function inWork(n){ return workRows().some(function(r){ return r.n===n; }); }
  try{
    localStorage.clear(); CARRY.seats=true; resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen(); setView('work'); paint();
    var n0 = JONAMES.length;

    addCaddie('홍길동', 1);
    delCaddie(JONAMES[0]);          // 원래 있던 사람 하나를 지운다
    var gone = '(위에서 지운 사람)';
    paint(); daySave();
    L('넣고 지운 뒤', '명부 '+n0+' → '+JONAMES.length+' · 홍길동 '+(has('홍길동')?'있음':'없음'));

    // 설정에 진짜 적혔나
    var raw = localStorage.getItem('board16.cfg') || localStorage.getItem(typeof CFGKEY!=='undefined'?CFGKEY:'');
    var keys = []; for (var i=0;i<localStorage.length;i++) keys.push(localStorage.key(i));
    L('  저장 칸들', keys.join(' '));
    var cfgk = keys.filter(function(k){ return /cfg/i.test(k); })[0];
    var cfg = cfgk ? JSON.parse(localStorage.getItem(cfgk)) : null;
    L('  설정에 명부', cfg && cfg.jonames ? cfg.jonames.length+'명 · 홍길동 '
        +(cfg.jonames.indexOf('홍길동')>=0?'있음 ◎':'없음 ✗') : '★안 들어감');

    // ★새로고침 흉내 — 메모리를 비우고 저장본만으로 다시 읽는다
    JONAMES = []; JOMAP = {}; BU3SET = null; OFFDUTY = [];
    DAY = JSON.parse(JSON.stringify(BOARD.day || DAY));
    bootLoad(); paint();
    L('', '');
    L('★새로고침 뒤', '명부 '+JONAMES.length+'명');
    L('  홍길동', (has('홍길동')?'명부에 있음 ◎':'✗ 사라짐') + ' · 근무표 '+(inWork('홍길동')?'보임 ◎':'✗ 안 보임')
      + ' · 조 '+(JOLABEL[joOf('홍길동')]||'미배정'));
    L('  지웠던 사람', (has(gone)?'✗ 되살아남':'안 돌아옴 ◎'));

    // ★내일로 넘겨도 남나
    carryToNextDay(); paint();
    L('', '');
    L('★내일로 넘긴 뒤 '+DATE, '명부 '+JONAMES.length+'명');
    L('  홍길동', (has('홍길동')?'명부에 있음 ◎':'✗ 사라짐')+' · 근무표 '+(inWork('홍길동')?'보임 ◎':'✗ 안 보임'));
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length?E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},1400);
</script>
