<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  try{
    localStorage.clear(); CARRY.seats=true; resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen(); setView('board'); cur='1'; paint();

    // ★밖에 있는 사람을 일부러 만든다 — seats=true 로 시작하면 모두가 앉아 있다.
    //   두 부에 걸친 사람도 있으니 있는 부를 전부 뺀다
    ['정용만', '김성호'].concat(JONAMES.slice(0, 6)).some(function(nm){
      var ps = partsOf(nm);
      if (!ps.length) return false;
      ps.forEach(function(pk2){
        delFromPart(pk2, nm);
      });
      return !partsOf(nm).length;
    });
    var out = workRows().filter(function(r){ return !partsOf(r.n).length; })[0];
    clearSeat('1', 24);
    var N0 = active(part('1')).length, blanks0 = active(part('1')).filter(function(r){ return !r.n; }).length;
    L('빈 칸 만듦', '1부 ' + N0 + '줄 · 빈 줄 ' + blanks0 + '개 · 25번 = ' + (active(part('1'))[24].n || '(빔)'));
    L('밖에 있는 사람', out ? out.n + ' (' + out.st + ')' : '없음');
    insertAt('1', 24, out.n);
    L('★빈 칸에 넣으니', '1부 ' + active(part('1')).length + '줄 '
      + (active(part('1')).length === N0 ? '◎ 안 늘었다' : '✗ 늘었다')
      + ' · 25번 = ' + (active(part('1'))[24].n || '(빔)')
      + ' · 빈 줄 ' + active(part('1')).filter(function(r){ return !r.n; }).length + '개');
    L('  기록', LOG[0] ? LOG[0].msg : '없음');

    // 사람이 앉은 칸에 넣으면 밀어야 한다
    var out2 = workRows().filter(function(r){ return !partsOf(r.n).length; })[0];
    var N1 = active(part('1')).length, was10 = active(part('1'))[9].n;
    insertAt('1', 9, out2.n);
    L('', '');
    L('사람 있는 칸(10번)에 ' + out2.n, '1부 ' + N1 + ' → ' + active(part('1')).length
      + (active(part('1')).length === N1 + 1 ? ' ◎ 밀었다' : ' ✗'));
    L('  10번 · 11번', active(part('1'))[9].n + ' · ' + active(part('1'))[10].n
      + (active(part('1'))[10].n === was10 ? ' ◎' : ' ✗'));
    L('  기록', LOG[0] ? LOG[0].msg : '없음');
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},900);
</script>
