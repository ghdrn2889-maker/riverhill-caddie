<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function sheetTx(pk,i){ openCell(pk,i);
    var g=document.getElementById('sheet').querySelector('[data-sg]');
    var box=(g?g.closest('.grp'):null)||[].slice.call(document.getElementById('sheet').querySelectorAll('.grp'))
      .filter(function(x){ return x.textContent.indexOf('한꺼번에 앉히기')>=0; })[0];
    return box ? box.textContent.replace(/\s+/g,' ').trim() : '(칸 없음)';
  }
  try{
    localStorage.clear(); CARRY.seats=true; resetToBoard(); DATE=BOARD.date;
    savedSig=null; PENDING=null; CAUGHT=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad(); caughtSeen(); setView('board'); paint();

    L('① 아무 배지도 안 달았을 때', sheetTx('1', 7));

    // 조출인데 이미 자리가 있는 사람을 억지로 만든다
    var seated = active(part('1'))[3].n;
    TAG[seated] = '조출';                        // vacate 를 안 거치게 직접
    // 2,3 인데 1부 칸에서 보는 사람
    var d = active(part('2'))[1].n;
    TAG[d] = '2,3';
    // 쉬는데 조출 배지
    var rest = active(part('2'))[2].n;
    TAG[rest] = '휴무';
    paint();
    L('', '');
    L('② 1부 칸 — 왜 안 부르는지', sheetTx('1', 7));

    // 진짜 후보 하나
    var pool = allPeople().filter(function(n){ return !dayMark(n) && !isBu3(n); });
    setDayTag(pool[0], '조출');
    L('', '');
    L('③ 조출 한 명 만들고 나서', sheetTx('1', 7));
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},900);
</script>
