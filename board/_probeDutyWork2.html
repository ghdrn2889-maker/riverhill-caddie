<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
function R(n){ return workRows().filter(function(x){ return x.n===n; })[0]; }
function say(n){ var r=R(n); return r? (r.st+' ['+r.cls+'] 배지['+r.bts.join('][')+']') : '(근무표에 없음)'; }
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function ok(c,k,v){ o.push((c?'◎ ':'✗ ')+k+': '+v); }
  try{
    localStorage.clear(); resetToBoard(); DATE=BOARD.date;
    savedSig=null; STACK=[]; REDO=[]; LOG=[];
    bootLoad();
    var A='김동윤', B='한지홍', C='남재권';
    DUTY['당번']=[]; DUTY['벌당']=[]; DUTY['흡연실 당번']=[];
    dutyToggle('흡연실 당번', A); dutyToggle('당번', B); dutyToggle('벌당', C);
    applyLineup(seonbal(), ['1','2']); applyLineup(bu3Start(), ['3']);
    setView('work'); paint();

    L('','★갑. 근무표 줄 (자리를 받은 뒤)');
    L('  '+A+'(흡연실)', say(A));
    L('  '+B+'(당번)', say(B));
    L('  '+C+'(벌당)', say(C));
    ok(R(A) && (R(A).cls==='w'||R(A).cls==='d'), '  흡연실 당번이 자리를 받아 근무·대기로', R(A)? R(A).st+' ['+R(A).cls+']' : '-');
    ok(R(A) && R(A).bts.indexOf('흡연실')>=0, '  그래도 당번 배지는 붙나', R(A)? R(A).bts.join(' ') : '-');
    ok(R(B) && R(B).cls==='u' && R(C) && R(C).cls==='u', '  당번·벌당은 미배치(u)',
       (R(B)?R(B).st+'/'+R(B).cls:'-')+' · '+(R(C)?R(C).st+'/'+R(C).cls:'-'));

    L('','★을. 셈 — 가용에 드나');
    var t0 = workTally();
    L('  집계', JSON.stringify(t0));

    L('','★병. 자리를 안 줬을 때 (순번 세우기 전)');
    DAY.forEach(function(p){ p.roster=[]; });
    PLAN={}; paint();
    L('  '+A+'(흡연실)', say(A));
    L('  '+B+'(당번 7:00~12:00)', say(B));
    ok(R(A) && R(A).cls==='u' && R(A).st==='미배치', '  흡연실 당번은 미배치(가용)', R(A)? R(A).st+'/'+R(A).cls : '-');
    ok(R(B) && R(B).cls==='u', '  당번은 안 겹치는 라운드가 있어 미배치', R(B)? R(B).st+'/'+R(B).cls : '-');

    L('','★정. 근무 안 함으로 바꾸면');
    setDutyWork('흡연실 당번','no'); paint();
    L('  '+A, say(A));
    ok(R(A) && R(A).cls==='o', '  그 밖(o)으로 간다', R(A)? R(A).st+'/'+R(A).cls : '-');
    ok(inLineup(A,'bu3')===false, '  순번에서도 빠진다', String(inLineup(A,'bu3')));
    setDutyWork('흡연실 당번','in'); paint();
    ok(R(A) && R(A).cls==='u', '  되돌리면 다시 가용', R(A)? R(A).st+'/'+R(A).cls : '-');

    L('','★무. 하루를 통째로 잡는 당번은 그대로 막나');
    dtAddWith('종일 당번','',0); setDutyWork('종일 당번','no');
    dutyToggle('종일 당번', C);
    paint();
    L('  '+C, say(C));
    ok(R(C) && R(C).cls==='o', '  근무 안 함 당번은 그 밖', R(C)? R(C).st+'/'+R(C).cls : '-');
    ok(canRound(C)===false, '  남는 라운드가 없다', String(canRound(C)));
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},1400);
</script>
