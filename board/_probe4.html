<div id="PROBE"></div>
<script>
(function(){
  var out=[]; function log(k,v){ out.push(k+': '+v); }
  function pe(t,el,x,y){ el.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,pointerId:1,
    pointerType:'mouse',clientX:x,clientY:y,button:0,buttons:t==='pointerup'?0:1})); }
  function order(){ var a=[],ks=document.querySelectorAll('#dutyBox .slot .k');
    for(var i=0;i<ks.length;i++)a.push(ks[i].textContent); return a.join('>'); }
  try{
    closeSheet();
    log('시작', order()+' / 창='+document.getElementById('sheet').className);
    var ss=document.querySelectorAll('#dutyBox .slot');
    var g=ss[2].querySelector('[data-grip]');
    var a=ss[2].getBoundingClientRect(), b=ss[0].getBoundingClientRect();
    pe('pointerdown',g,a.left+5,a.top+a.height/2);
    pe('pointermove',g,a.left+5,b.top+2);
    pe('pointerup',g,a.left+5,b.top+2);
    // 브라우저는 pointerup 뒤에 click을 낸다 — 흉내낸다
    ss[2].dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true}));
    log('끈뒤', order()+' / 창='+document.getElementById('sheet').className);
    setTimeout(function(){
      // 그냥 누르면 창이 열려야 한다
      document.querySelectorAll('#dutyBox .slot')[0].click();
      log('그냥누름', '창='+document.getElementById('sheet').className
        +' / '+(document.querySelector('#sheet .st')||{textContent:'-'}).textContent);
      document.getElementById('PROBE').textContent=out.join('  ;;  ');
    },30);
  }catch(e){ out.push('ERROR: '+e.message);
    document.getElementById('PROBE').textContent=out.join('  ;;  '); }
})();
</script>
