<div id="PROBE"></div>
<script>
var ERRS=[]; window.addEventListener('error',function(e){ERRS.push(e.message+' @'+e.lineno);});
(function(){
  var out=[]; function log(k,v){out.push(k+': '+v);}
  function slots(){var a=[],ks=document.querySelectorAll('#dutyBox .slot');
    for(var i=0;i<ks.length;i++)a.push(ks[i].querySelector('.k').textContent+'='+ks[i].querySelector('.v').textContent);
    return a.join(' , ');}
  function nm(){var a=[],rs=document.querySelectorAll('#sheet .dnm');
    for(var i=0;i<rs.length;i++)a.push('['+rs[i].value+']');return a.join(' ');}
  function fire(el,v){el.value=v;el.dispatchEvent(new Event('change',{bubbles:true}));}
  function act(n){var bs=document.querySelectorAll('#sheet button');
    for(var i=0;i<bs.length;i++)if(bs[i].getAttribute('data-act')===n)return bs[i];return null;}
  function pe(t,el,x,y){el.dispatchEvent(new PointerEvent(t,{bubbles:true,cancelable:true,pointerId:1,
    pointerType:'mouse',clientX:x,clientY:y,button:0,buttons:t==='pointerup'?0:1}));}
  try{
    openDuty('\ubc8c\ub2f9');
    // 후보 눌러 넣기
    document.querySelectorAll('#dutySug button')[0].click();
    document.querySelectorAll('#dutySug button')[0].click();
    log('후보넣기', nm()+' || '+slots());
    // 이미 있는 이름 다시 치면 막힌다
    document.getElementById('dutyQ').value=document.querySelectorAll('#sheet .dnm')[0].value;
    act('dutyadd').click();
    log('중복막기', nm());
    // 후보 목록에서 이미 넣은 사람은 빠졌나
    var got=document.querySelectorAll('#sheet .dnm')[0].value, dup=0;
    var sg=document.querySelectorAll('#dutySug button');
    for(var i=0;i<sg.length;i++)if(sg[i].getAttribute('data-dutytog')===got)dup++;
    log('후보중복', dup+'건');
    // 전부 비우기
    act('dutyclear').click();
    log('전부비움', nm()+' || '+slots());
    // 배치표에서 칸 끌기
    var ss=document.querySelectorAll('#dutyBox .slot');
    var g=ss[2].querySelector('[data-grip]'),a=ss[2].getBoundingClientRect(),b=ss[0].getBoundingClientRect();
    pe('pointerdown',g,a.left+5,a.top+a.height/2);pe('pointermove',g,a.left+5,b.top+2);pe('pointerup',g,a.left+5,b.top+2);
    log('칸끌기', slots());
    // 설정 기본값
    openCfg(); document.querySelector('[data-ctab="dt"]').click();
    fire(document.querySelectorAll('#cfg [data-dtdef]')[0],'08:00');
    fire(document.querySelectorAll('#cfg [data-dtdefh]')[0],'6');
    log('설정줄', document.querySelectorAll('#cfg .crow[data-dtrow] .lb')[0].textContent);
    closeCfg();
    log('errs', ERRS.join(' | ')||'none');
  }catch(e){out.push('ERROR: '+e.message+' | '+(e.stack||'').split('\n')[1]);}
  document.getElementById('PROBE').textContent=out.join('  ;;  ');
})();
</script>
