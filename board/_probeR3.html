<div id="PROBE">시작 안 함</div>
<script>
var ERRS = []; window.addEventListener('error', function(e){ ERRS.push(e.message + ' @' + e.lineno); });
(function(){
  var out = []; function log(k, v){ out.push(k + ': ' + v); document.getElementById('PROBE').textContent = out.join('  ;;  '); }
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  function rows(){ return document.querySelectorAll('#drwBody .rrow'); }
  function list(n){ var a = [], rs = rows();
    for (var i = 0; i < Math.min(n || 8, rs.length); i++)
      a.push(rs[i].querySelector('.rp').textContent + rs[i].querySelector('.rn').textContent);
    return a.join(' '); }
  function pe(t, el, x, y){ el.dispatchEvent(new PointerEvent(t, {bubbles:true, cancelable:true,
    pointerId:1, pointerType:'mouse', clientX:x, clientY:y, button:0, buttons: t === 'pointerup' ? 0 : 1})); }
  function drag(f, to, below){
    var g = f.querySelector('[data-grip]');
    var a = f.getBoundingClientRect(), b = to.getBoundingClientRect();
    var ty = below ? b.bottom - 2 : b.top + 2;
    pe('pointerdown', g, a.left + 5, a.top + a.height / 2);
    pe('pointermove', g, a.left + 5, ty);
    pe('pointerup', g, a.left + 5, ty);
  }
  (async function(){
    try {
      openDrawer();
      log('손잡이', document.querySelectorAll('#drwBody .rrow [data-grip]').length + '개 / 줄 '
        + rows().length + '개');
      log('처음', list(6));
      // ① 5번째를 맨 위로
      var rs = rows();
      var nm = rs[4].querySelector('.rn').textContent;
      drag(rs[4], rs[0], false);
      await wait(40);
      log('5번째 → 맨 위', list(6));
      log('기록', (document.querySelector('#logsec .li span') || {textContent:'-'}).textContent);
      // ② 배치표에도 반영됐나
      var c0 = document.querySelector('#col' + drwPart + ' [data-pk][data-i]');
      log('배치표 1번', c0 ? c0.getAttribute('data-nm') : '?');
      // ③ 맨 위를 아래로
      rs = rows();
      drag(rs[0], rs[3], true);
      await wait(40);
      log('맨 위 → 4번째', list(6));
      // ④ 제자리에 놓으면 기록이 안 늘어야 한다
      var n0 = document.querySelectorAll('#logsec .li').length;
      rs = rows();
      drag(rs[2], rs[2], false);
      await wait(40);
      log('제자리', '기록 ' + n0 + '→' + document.querySelectorAll('#logsec .li').length);
      // ⑤ ↑ 단추도 그대로 되나
      rows()[2].querySelector('[data-up]').click();
      await wait(40);
      log('↑ 단추', list(6));
      // ⑥ 되돌리기
      undo(); await wait(40);
      log('되돌림', list(6));
      // ⑦ 다른 부로 옮겨도 되나
      document.querySelector('[data-dtab="3"]').click();
      await wait(40);
      var r3 = rows();
      log('3부 처음', list(5));
      drag(r3[3], r3[0], false);
      await wait(40);
      log('3부 옮김', list(5) + ' | ' + (document.querySelector('#logsec .li span')||{textContent:'-'}).textContent);
      log('errs', ERRS.join(' | ') || 'none');
    } catch (e) { out.push('ERROR: ' + e.message + ' | ' + (e.stack || '').split('\n')[1]); }
    document.getElementById('PROBE').textContent = out.join('  ;;  ');
  })();
})();
</script>
