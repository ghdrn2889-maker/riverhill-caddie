<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
function tap(el){ if(!el) return false; el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})); return true; }
function q(s){ return document.querySelector(s); }
function qa(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function btn(attr,v){ return qa('#sheet button').filter(function(b){return b.getAttribute(attr)===v;})[0]; }
function where(n){ return partsOf(n).map(function(k){
  var a=active(part(k)).map(function(r){return r.n;}); var i=a.indexOf(n);
  return part(k).name+' '+(i>=0?(i+1)+'번':'결근'); }).join(' · ') || '(어느 부에도 없음)'; }
function cnt(){ return DAY.map(function(p){return p.name+' '+p.roster.length;}).join('·')+' · 제외 '+OFFDUTY.length; }
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  try{
    setView('work');
    var nm=active(part('1'))[10].n;
    // 이제 날이 넘어오면 겹친 자리가 풀리므로, 두 부에 든 사람을 직접 만들어 시험한다
    if (partsOf(nm).length < 2) addRow('2', nm);
    L('시작', cnt()+' · '+nm+' 부 '+partsOf(nm).join(','));
    openPerson(nm);
    L('사람 창', q('#sheet .st').textContent+' · '+where(nm));
    L('  칸', qa('#sheet .grp h4').map(function(x){return x.textContent;}).join(' | '));
    L('  단추', qa('#sheet .acts button[data-prm],#sheet .acts button[data-padd]')
        .map(function(b){return '"'+b.textContent+'"';}).join(' '));

    var pmB=function(){ return qa('#sheet .acts.pm button').map(function(b){return b.textContent;}); };
    var pmX=function(){ return qa('#sheet .acts.pm button').map(function(b){return Math.round(b.getBoundingClientRect().left);}); };
    var x0=pmX();
    L('  가로 자리', x0.join(' / '));
    tap(qa('#sheet .acts.pm button')[0]);
    L('1부 빼기 뒤 단추', pmB().join(' | '));
    L('  가로 자리', pmX().join(' / ')+' → '+(x0.join()===pmX().join()?'안 움직임 ◎':'움직임 ✗'));
    L('  창', $('sheet').className.indexOf('on')>=0?'열림 ◎':'닫힘(문제)');
    L('1부에서 빼기', where(nm)+' · '+cnt()+' · 제외인원 '+(OFFDUTY.indexOf(nm)>=0?'들어감(문제)':'안 들어감 ◎'));
    tap(btn('data-prm','2'));
    L('2부에서도 빼기', where(nm)+' · '+cnt()+' · 제외인원 '+(OFFDUTY.indexOf(nm)>=0?'들어감 ◎':'안 들어감(문제)'));
    tap(btn('data-padd','3'));
    L('3부에 넣기', where(nm)+' · '+cnt()+' · 기록 '+LOG[0].msg);

    // 쉬는 사람 넣기
    var rest=JONAMES.filter(function(n){ return tagOf(n)==='병가' && !partsOf(n).length; })[0]
          || JONAMES.filter(function(n){ return isAbs(tagOf(n)) && !partsOf(n).length; })[0];
    openPerson(rest);
    L('쉬는 사람', rest+' · 배지 '+tagOf(rest));
    tap(btn('data-padd','2'));
    L('  2부에 넣은 뒤', where(rest)+' · 배지 '+(tagOf(rest)||'없음 ◎'));

    // 서랍 — 후보 눌러 넣기 · × 로 빼기
    openDrawer();
    var sug=qa('.drwsug button[data-pn]');
    L('서랍 후보', sug.length+'명 · 앞 3 '+sug.slice(0,3).map(function(b){return b.textContent;}).join(' '));
    var pk=sug[0].getAttribute('data-pn'), n0=part(drwPart).roster.length;
    tap(sug[0]);
    L('  후보 눌러 넣기', pk+' → '+part(drwPart).name+' 명단 '+n0+'→'+part(drwPart).roster.length
      + ' · 후보에서 '+(qa('.drwsug button[data-pn="'+pk+'"]').length?'남음(문제)':'빠짐 ◎'));
    var last=part(drwPart).roster.length-1, ln=part(drwPart).roster[last].n;
    tap(qa('.rrow button[data-del="'+last+'"]')[0]);
    L('  × 로 빼기', ln+' → 명단 '+part(drwPart).roster.length+'명 · 제외인원 '
      + (OFFDUTY.indexOf(ln)>=0?'들어감 ◎':'안 들어감(다른 부에 있음)'));

    var steps=0; while(steps<9 && STACK.length){ undo(); steps++; }
    L('되돌리기 '+steps+'번', cnt());
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},900);
</script>
