<div id="PROBE"></div>
<script>
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  function pos(pk,nm){ var a=active(part(pk)).map(function(r){return r.n;});
    var i=a.indexOf(nm); return i<0?'없음':(i+1)+'번'; }
  function tm(pk,nm){ var p=part(pk),a=active(p).map(function(r){return r.n;});
    var i=a.indexOf(nm); return (i>=0&&p.tees[i])?p.tees[i].time:'대기'; }
  try{
    localStorage.clear(); CARRY.seats = true; resetToBoard();   /* 옛 전제: 처음 배치표 그대로 */ savedSig=null; PENDING=null; CAUGHT=null; DATE=BOARD.date;
    bootLoad(); caughtSeen(); applyLineup(seonbal(),['1','2']);
    var w=active(part('1'))[6].n, second=active(part('1'))[1].n;
    L('전', w+' '+pos('1',w)+' '+tm('1',w)+' · 뺄 사람 '+second+' '+pos('1',second));
    delFromPart('1', second);
    L('앞사람 뺀 뒤', w+' '+pos('1',w)+' '+tm('1',w)
      + ' ' + (pos('1',w)==='6번' ? '◎ 한 칸 당겨짐(순번이 움직인다)' : '순번 그대로'));
    undo();
    L('되돌림', w+' '+pos('1',w)+' '+tm('1',w));
    // 자리만 비우면?
    var i2=active(part('1')).map(function(r){return r.n;}).indexOf(second);
    clearSeat('1', i2);
    L('앞자리를 비우면', w+' '+pos('1',w)+' '+tm('1',w)
      + ' ' + (pos('1',w)==='7번' ? '◎ 안 움직임(칸이 남으니까)' : '✗ 움직임'));
  }catch(e){ o.push('터짐 '+e.message); }
  document.getElementById('PROBE').textContent=o.join('\n');
},900);
</script>
