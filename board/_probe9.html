<div id="PROBE"></div>
<script>
(function(){
  var out=[]; function log(k,v){ out.push(k+': '+v); }
  try{
    openDuty('\ubc8c\ub2f9');
    document.querySelectorAll('#dutySug button')[0].click();
    log('1클릭', JSON.stringify(DUTY['\ubc8c\ub2f9'])+' drow='+document.querySelectorAll('#sheet .drow').length);
    openDuty('\ubc8c\ub2f9');
    log('재열기', JSON.stringify(DUTY['\ubc8c\ub2f9'])+' drow='+document.querySelectorAll('#sheet .drow').length
      +' sug='+document.querySelectorAll('#dutySug button').length);
    var b2=document.querySelectorAll('#dutySug button')[0];
    log('2번째버튼', b2?b2.getAttribute('data-dutytog'):'none');
    b2.click();
    log('2클릭', JSON.stringify(DUTY['\ubc8c\ub2f9'])+' drow='+document.querySelectorAll('#sheet .drow').length);
    openDuty('\ubc8c\ub2f9');
    log('재열기2', JSON.stringify(DUTY['\ubc8c\ub2f9'])+' drow='+document.querySelectorAll('#sheet .drow').length
      +' dtm='+document.querySelectorAll('#sheet .dtm').length);
  }catch(e){ out.push('ERROR: '+e.message); }
  document.getElementById('PROBE').textContent=out.join('  ;;  ');
})();
</script>
