<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
function q(s){ return document.querySelector(s); }
function tap(el){ if(!el) return false; el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})); return true; }
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  try{
    localStorage.clear(); CARRY.seats = true; resetToBoard();   /* 옛 전제: 처음 배치표 그대로 */ daySave();
    tap(document.getElementById('hDate'));
    L('머리 날짜 누름', q('#sheet .st')? q('#sheet .st').textContent+' ◎':'(안 열림 ✗)');
    L('  줄', Array.prototype.slice.call(document.querySelectorAll('#sheet [data-daygo]'))
        .map(function(b){return b.textContent.replace(/\s+/g,' ').trim();}).join(' | '));
    // ★수동 넘기기는 없어졌다 — 날은 저절로 간다
    L('  넘기기 단추', document.querySelector('#sheet [data-act="nday"]')?
        '✗ 아직 있다' : '없음 ◎');
    L('  이 날의 구분 비우기', document.querySelector('#sheet [data-act="wipemk"]')?
        '있음 ◎' : '✗ 사라졌다');
  }catch(err){ o.push('터짐: '+err.message); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},900);
</script>
