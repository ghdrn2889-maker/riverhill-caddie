<div id="PROBE"></div>
<script>
var E=[]; window.addEventListener('error',function(e){E.push(e.message+' @'+e.lineno);});
function q(s){ return document.querySelector(s); }
function qa(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function tap(el){ if(!el) return false; el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true})); return true; }
setTimeout(function(){
  var o=[]; function L(k,v){ o.push(k+': '+v); }
  try{
    L('진짜 오늘', todayLabel());
    L('표본 날짜', BOARD.date);

    // ① 아무것도 저장 안 된 상태로 켜면 오늘이 되어 있어야
    localStorage.clear(); CARRY.seats = true; resetToBoard();   /* 옛 전제: 처음 배치표 그대로 */
    savedSig=null; PENDING=null; CAUGHT=null;
    DATE=BOARD.date;
    bootLoad();
    L('맨 처음 켜기', DATE+(DATE===todayLabel()? ' → 오늘 ◎':' → 뒤처짐 ✗'));
    L('  알림', CAUGHT? CAUGHT.from+' → '+CAUGHT.to+' ◎':'없음(문제)');
    L('  저장 표시', unsaved()? '저장 안 함(문제)':'저장됨 ◎');
    L('  기록', LOG.length? LOG[0].msg:'없음');
    // 세웠다면 기록이 한 줄 더 남는다 — 표본이 이미 그 차례라 moved 로는 못 가린다
    L('  ★순번을 저절로 세웠나', '3부 시작 '+(SB3||'없음')+' 은(는) 정해 둠 · 기록 '+LOG.length+'줄 ['
      + LOG.map(function(x){return x.msg;}).join(' / ')+'] → '
      + (LOG.length===1? '자리는 안 건드림 ◎':'세웠음(문제)'));
    L('  칸', (function(){ var n=[]; for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
        if(k.indexOf('board.')===0) n.push(k); } return n.sort().join(' / '); })());

    // ② 화면에 알림 줄이 뜨나
    setView('work');
    var nd=q('.drift.newd');
    L('알림 줄', nd? '있음 ◎ · '+nd.querySelector('.dt').textContent : '없음(문제)');
    L('  단추', qa('.drift.newd .dbtn button').map(function(b){return '"'+b.textContent+'"';}).join(' '));

    // ③ 지난 날이 남아 있나
    openDayPick();
    L('날짜 고르개', qa('#sheet [data-daygo]').map(function(b){
        return b.textContent.replace(/\s+/g,' ').trim(); }).join(' | '));
    tap(q('#sheet button[data-act="close"]')||q('#sheet .close'));

    // ④ 알겠습니다 → 줄이 사라지고 다시 켜도 안 뜬다
    setView('work');
    tap(qa('.drift.newd .dbtn button').filter(function(b){
      return b.getAttribute('data-act')==='cgtseen'; })[0]);
    L('알겠습니다', q('.drift.newd')? '줄 남음(문제)':'줄 사라짐 ◎');
    savedSig=null; CAUGHT=null; bootLoad(); setView('work');
    L('  다시 켜도', q('.drift.newd')? '또 뜸(문제)':'안 뜸 ◎');
    L('  날짜', DATE+(DATE===todayLabel()? ' ◎':' ✗'));

    // ⑤ 이미 오늘이면 아무 일도 안 일어나야
    var n0=dayList().length, lg=LOG.length;
    savedSig=null; bootLoad();
    L('오늘인 채로 또 켜기', DATE+' · 저장된 날 '+n0+'→'+dayList().length
      + ' · 알림 '+(caughtRead()? '뜸(문제)':'없음 ◎'));

    // ⑥ 며칠 밀렸어도 한 칸만 만든다
    localStorage.clear(); CAUGHT=null; PENDING=null;
    DATE='2026년 08월 20일'; savedSig=state(); daySave();
    savedSig=null; CAUGHT=null; bootLoad();
    L('열흘 밀린 뒤 켜기', DATE+' · 저장된 날 '
      + dayList().map(function(d){return d.date;}).join(' / '));
    L('  ★빈 날을 잔뜩 만들었나', dayList().length<=2? '아니오 ◎ (지난 날 + 오늘)':'예 ✗');
  }catch(err){ o.push('터짐: '+err.message+' @'+(err.stack||'').split('\n')[1]); }
  o.push('errs: '+(E.length? E.join(' | '):'none'));
  document.getElementById('PROBE').textContent=o.join('\n');
},900);
</script>
