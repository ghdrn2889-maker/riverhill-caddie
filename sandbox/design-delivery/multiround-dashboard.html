<title>다중 라운드 대시보드 재설계</title>
<style>
  :root{
    --bg:#f7f6f0; --card:#ffffff; --ink:#17231d; --sub:#647168; --line:#e2e7e1;
    --green:#104d31; --green2:#2e7149;
    /* 부별 색 — 1부 조출(새벽 분홍) · 2부 낮(하늘) · 3부 저녁(보라) */
    --p1a:#e06aa0; --p1b:#c14b86; --p1ink:#8a2f5c;
    --p2a:#3a8fd4; --p2b:#1f5fa0; --p2ink:#164a7d;
    --p3a:#8b6cd8; --p3b:#5f43a8; --p3ink:#4a3487;
    --work:#0b6d3d; --spare:#b5771a; --amberbg:#fff7e8; --amberline:#f0dcae;
    --shadow:0 6px 20px rgba(24,54,35,.07);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#12140f; --card:#1c211b; --ink:#eef2ea; --sub:#9aa79d; --line:#2c332b;
      --p1a:#b8456f; --p1b:#7f2e57; --p1ink:#f0a9c8;
      --p2a:#2668a0; --p2b:#153c63; --p2ink:#8ec1ec;
      --p3a:#6d4fb8; --p3b:#3f2a7a; --p3ink:#c3b0f0;
      --amberbg:#2a2415; --amberline:#4a3d1e; --spare:#e0b968; --work:#59c98d;
      --shadow:0 6px 22px rgba(0,0,0,.4); }
  }
  :root[data-theme="dark"]{ --bg:#12140f; --card:#1c211b; --ink:#eef2ea; --sub:#9aa79d; --line:#2c332b;
    --p1a:#b8456f; --p1b:#7f2e57; --p1ink:#f0a9c8; --p2a:#2668a0; --p2b:#153c63; --p2ink:#8ec1ec;
    --p3a:#6d4fb8; --p3b:#3f2a7a; --p3ink:#c3b0f0; --amberbg:#2a2415; --amberline:#4a3d1e; --spare:#e0b968; --work:#59c98d;
    --shadow:0 6px 22px rgba(0,0,0,.4); }
  :root[data-theme="light"]{ --bg:#f7f6f0; --card:#ffffff; --ink:#17231d; --sub:#647168; --line:#e2e7e1;
    --p1a:#e06aa0; --p1b:#c14b86; --p1ink:#8a2f5c; --p2a:#3a8fd4; --p2b:#1f5fa0; --p2ink:#164a7d;
    --p3a:#8b6cd8; --p3b:#5f43a8; --p3ink:#4a3487; --amberbg:#fff7e8; --amberline:#f0dcae; --spare:#b5771a; --work:#0b6d3d;
    --shadow:0 6px 20px rgba(24,54,35,.07); }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:560px; margin:0 auto; padding:0 0 40px; }

  /* 데모 상단 바 + 시나리오 스위처 (샘플 전용, 실제 앱엔 미포함) */
  .demobar{ position:sticky; top:0; z-index:9; background:var(--bg);
    padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  .demobar h1{ font-size:13px; margin:0 0 3px; letter-spacing:-.01em; }
  .demobar p{ font-size:11px; color:var(--sub); margin:0 0 10px; line-height:1.45; }
  .switch{ display:flex; flex-wrap:wrap; gap:6px; }
  .switch button{ font:inherit; font-size:12px; font-weight:700; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--sub);
    border-radius:999px; padding:6px 13px; transition:.15s; }
  .switch button.on{ background:var(--green); color:#fff; border-color:var(--green); }

  .top{ background:var(--green); color:#fff; padding:16px 18px 13px; }
  .toprow{ display:flex; justify-content:space-between; align-items:center; }
  .brand{ font-size:11px; font-weight:850; letter-spacing:.09em; }
  .date{ font-size:10px; opacity:.72; }
  .body{ padding:16px 14px; }

  /* ─── 라운드 여정 패널 ─────────────────────────────── */
  .journey{ margin:0 0 14px; }
  /* 요약 리본 — 탕수·홀·부조합 + 하루 티오프 흐름(아침→저녁 스윕) */
  .ribbon{ position:relative; overflow:hidden; border-radius:16px; padding:13px 15px 12px;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); }
  .ribbon .rb-top{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .rb-tang{ font-size:19px; font-weight:850; letter-spacing:-.03em; }
  .rb-tang small{ font-size:12px; font-weight:700; color:var(--sub); margin-left:6px; letter-spacing:0; }
  .rb-holes{ font-size:12px; font-weight:800; color:#fff; background:var(--green2);
    border-radius:9px; padding:3px 10px; white-space:nowrap; font-variant-numeric:tabular-nums; }
  /* 하루 흐름 트랙: 부 노드가 아침→저녁으로 배치 */
  .rb-flow{ position:relative; height:26px; margin:12px 4px 2px; }
  .rb-flow .ln{ position:absolute; left:4px; right:4px; top:11px; height:3px; border-radius:3px;
    background:linear-gradient(90deg,var(--p1a),var(--p2a),var(--p3a)); opacity:.35; }
  .rb-node{ position:absolute; top:2px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:3px; }
  .rb-dot{ width:15px; height:15px; border-radius:50%; border:3px solid var(--card);
    box-shadow:0 0 0 1.5px rgba(0,0,0,.06); }
  .rb-node small{ font-size:8.5px; font-weight:800; letter-spacing:.02em; }
  .rb-node.on .rb-dot{ width:17px; height:17px; box-shadow:0 0 0 4px rgba(0,0,0,.06); }
  .rb-node.dim{ opacity:.32; }

  /* 여정 스파인 + 라운드 카드 */
  .spine{ position:relative; margin-top:12px; padding-left:26px; }
  .spine::before{ content:""; position:absolute; left:9px; top:6px; bottom:6px; width:2px;
    background:var(--line); border-radius:2px; }
  .rc{ position:relative; margin-bottom:10px; border-radius:15px; padding:13px 15px;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); }
  .rc:last-child{ margin-bottom:0; }
  .rc::before{ content:""; position:absolute; left:-22px; top:16px; width:14px; height:14px; border-radius:50%;
    border:3px solid var(--card); }
  .rc.p1::before{ background:var(--p1b); } .rc.p2::before{ background:var(--p2b); } .rc.p3::before{ background:var(--p3b); }
  /* 왼쪽 색 레일 */
  .rc::after{ content:""; position:absolute; left:0; top:12px; bottom:12px; width:4px; border-radius:4px; }
  .rc.p1::after{ background:linear-gradient(var(--p1a),var(--p1b)); }
  .rc.p2::after{ background:linear-gradient(var(--p2a),var(--p2b)); }
  .rc.p3::after{ background:linear-gradient(var(--p3a),var(--p3b)); }

  .rc-head{ display:flex; align-items:center; gap:8px; }
  .rc-part{ font-size:14.5px; font-weight:850; letter-spacing:-.01em; }
  .rc.p1 .rc-part{ color:var(--p1ink); } .rc.p2 .rc-part{ color:var(--p2ink); } .rc.p3 .rc-part{ color:var(--p3ink); }
  .tag{ font-size:11px; font-weight:800; border-radius:7px; padding:2px 9px; letter-spacing:.01em; }
  .tag-work{ background:var(--work); color:#fff; }
  .tag-spare{ background:var(--amberbg); color:var(--spare); border:1px solid var(--amberline); }
  .tag-hero{ margin-left:auto; font-size:9px; font-weight:800; color:var(--sub); letter-spacing:.1em; }

  .rc-tee{ margin-top:9px; display:flex; align-items:baseline; gap:8px; }
  .rc-tee b{ font-size:30px; font-weight:850; letter-spacing:-.05em; line-height:1; font-variant-numeric:tabular-nums; }
  .rc-tee .crs{ font-size:12px; font-weight:800; color:var(--sub); }
  .rc-tee .to{ font-size:11px; color:var(--sub); font-weight:700; }

  /* 근무 라운드 이동 3구간 */
  .legs{ margin-top:11px; display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
  .leg{ background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:7px 8px; text-align:center; }
  .leg span{ display:block; font-size:8.5px; color:var(--sub); font-weight:800; letter-spacing:.06em; }
  .leg b{ font-size:13px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .leg .ic{ font-size:13px; }

  /* 스페어 라운드 대기 진행 */
  .wait{ margin-top:10px; }
  .wait .wtxt{ font-size:12.5px; color:var(--sub); line-height:1.4; }
  .wait .wtxt b{ color:var(--ink); }
  .wprog{ margin-top:8px; display:flex; align-items:center; gap:4px; }
  .wpip{ flex:1; height:6px; border-radius:4px; background:var(--line); }
  .wpip.done{ background:var(--spare); }
  .wpip.me{ background:repeating-linear-gradient(45deg,var(--spare),var(--spare) 3px,transparent 3px,transparent 6px); box-shadow:0 0 0 2px var(--amberbg); }

  /* 3부 히어로(이미 배포된 노을 카드) — 샘플에선 축약 재현 */
  .hero{ position:relative; overflow:hidden; border-radius:19px; padding:17px; color:#fff;
    background:linear-gradient(160deg,#e8935a 0%,#c96a6d 42%,#7d5a9e 100%); box-shadow:var(--shadow); }
  .hero .hl{ font-size:9px; font-weight:850; letter-spacing:.13em; opacity:.85; }
  .hero h3{ font-size:25px; line-height:1.1; letter-spacing:-.045em; margin:7px 0 5px; }
  .hero .hsub{ font-size:11.5px; line-height:1.5; opacity:.92; margin:0; }
  .heronote{ font-size:10px; color:var(--sub); text-align:center; margin:8px 0 0; }

  .caption{ font-size:11px; color:var(--sub); text-align:center; margin:16px 14px 0; line-height:1.5; }
</style>

<div class="wrap">
  <div class="demobar">
    <h1>다중 라운드 대시보드 — 재설계 샘플</h1>
    <p>같은 날 여러 부(1부 조출·2부·3부)를 뛰는 "두 탕/세 탕"을 하나의 <b>라운드 여정</b>으로.
       아래 버튼으로 상황을 바꿔보세요. (3부 노을 히어로는 이미 배포된 것 — 그 위에 얹힙니다)</p>
    <div class="switch" id="sw"></div>
  </div>

  <div class="top">
    <div class="toprow"><div class="brand">리버힐 캐디</div><div class="date">7월 29일 (수)</div></div>
  </div>

  <div class="body" id="stage"></div>

  <p class="caption">부별 색: <b style="color:var(--p1ink)">1부 조출·새벽 분홍</b> ·
    <b style="color:var(--p2ink)">2부 낮·하늘</b> · <b style="color:var(--p3ink)">3부 저녁·보라(노을 히어로)</b>.<br>
    라운드가 하나(순수 3부)면 여정 패널은 숨고 기존 화면 그대로 — 회귀 없음.</p>
</div>

<script>
  const HERO = `<div class="hero">
      <div class="hl">오늘 내 상황</div>
      <h3>오늘 3부 근무 확정</h3>
      <p class="hsub">티오프 17:20 · 백대기 16:30 · 집에서 15:20 출발</p>
    </div>
    <p class="heronote">↑ 이미 배포된 3부 노을 히어로 (실시간 이동 게이지 포함)</p>`;

  // 부 메타
  const PART = { '1':{ko:'1부 조출', dot:'p1'}, '2':{ko:'2부', dot:'p2'}, '3':{ko:'3부', dot:'p3'} };

  function leg(ic,label,time){ return `<div class="leg"><span>${label}</span><div class="ic">${ic}</div><b>${time}</b></div>`; }

  function workCard(r){
    return `<div class="rc ${PART[r.part].dot}">
      <div class="rc-head">
        <span class="rc-part">${PART[r.part].ko}</span>
        <span class="tag tag-work">근무</span>
        ${r.hero?'<span class="tag-hero">아래 히어로</span>':''}
      </div>
      <div class="rc-tee"><b>${r.tee}</b><span class="crs">${r.course}코스</span></div>
      <div class="legs">
        ${leg('🏠','집 출발',r.leave)}
        ${leg('📍','도착',r.arrive)}
        ${leg('⛳','백대기',r.standby)}
      </div>
    </div>`;
  }
  function spareCard(r){
    const pips = Array.from({length:r.total},(_,i)=>{
      const n=i+1; let cl = n<=r.filled?'done':(n===r.pos?'me':'');
      return `<div class="wpip ${cl}"></div>`;}).join('');
    return `<div class="rc ${PART[r.part].dot}">
      <div class="rc-head">
        <span class="rc-part">${PART[r.part].ko}</span>
        <span class="tag tag-spare">스페어</span>
      </div>
      <div class="wait">
        <div class="wtxt">현재 <b>${r.filled}팀</b> — <b>스페어 ${r.pos-r.filled}번</b>, 앞에 ${Math.max(0,r.pos-r.filled-1)}명.
          팀이 차면 바로 알려드릴게요.</div>
        <div class="wprog">${pips}</div>
      </div>
    </div>`;
  }

  function ribbon(rounds){
    const work = rounds.filter(r=>r.kind==='work');
    const tang = work.length>=3?'세 탕':work.length===2?'두 탕':'한 탕';
    const holes = work.length*18;
    const combo = rounds.map(r=>r.part+'부').join('·');
    // 하루 흐름 노드(1·2·3 위치 고정, 활성만 강조)
    const posMap = {'1':14,'2':50,'3':86};
    const nodes = ['1','2','3'].map(p=>{
      const on = rounds.some(r=>r.part===p);
      return `<div class="rb-node ${on?'on':'dim'}" style="left:${posMap[p]}%">
        <span class="rb-dot" style="background:var(--p${p}b)"></span><small style="color:var(--p${p}ink)">${p}부</small></div>`;
    }).join('');
    return `<div class="ribbon">
      <div class="rb-top">
        <div class="rb-tang">${tang}<small>${combo}</small></div>
        <div class="rb-holes">${holes}홀</div>
      </div>
      <div class="rb-flow"><div class="ln"></div>${nodes}</div>
    </div>`;
  }

  function render(rounds, opts={}){
    // 3부 근무는 아래 히어로가 담당 → 여정 카드에선 제외(중복 방지). 3부 스페어는 카드로.
    const cards = rounds.filter(r=>!(r.part==='3' && r.kind==='work'));
    const multi = rounds.length>=2;
    let html = '';
    if(multi){
      html += `<div class="journey">${ribbon(rounds)}
        <div class="spine">${cards.map(r=>r.kind==='work'?workCard(r):spareCard(r)).join('')}</div>
      </div>`;
    }
    // 히어로: 3부가 있으면 3부 노을, 없으면 대표 부를 히어로로(여기선 간단화해 안내만)
    if(rounds.some(r=>r.part==='3')) html += HERO;
    else html += `<p class="heronote">${opts.heroNote||'대표 라운드가 히어로로 표시됩니다.'}</p>`;
    document.getElementById('stage').innerHTML = html;
  }

  const SCEN = {
    '두 탕 (2부+3부)': ()=>render([
      {part:'2',kind:'work',tee:'11:40',course:'IN',leave:'09:40',arrive:'10:40',standby:'10:50'},
      {part:'3',kind:'work',hero:true,tee:'17:20',course:'OUT',leave:'15:20',arrive:'16:20',standby:'16:30'},
    ]),
    '세 탕 (1+2+3부)': ()=>render([
      {part:'1',kind:'work',tee:'06:10',course:'OUT',leave:'04:20',arrive:'05:20',standby:'05:20'},
      {part:'2',kind:'work',tee:'11:52',course:'IN',leave:'09:52',arrive:'10:52',standby:'11:02'},
      {part:'3',kind:'work',hero:true,tee:'17:04',course:'OUT',leave:'15:04',arrive:'16:04',standby:'16:14'},
    ]),
    '조출만 (1부)': ()=>render([
      {part:'1',kind:'work',tee:'06:34',course:'IN',leave:'04:44',arrive:'05:44',standby:'05:44'},
    ],{heroNote:'3부가 없는 날 — 1부(조출)가 대표 히어로로 올라갑니다.'}),
    '2부 스페어 + 3부 근무': ()=>render([
      {part:'2',kind:'spare',pos:9,filled:6,total:14},
      {part:'3',kind:'work',hero:true,tee:'17:20',course:'OUT',leave:'15:20',arrive:'16:20',standby:'16:30'},
    ]),
  };

  const sw = document.getElementById('sw');
  Object.keys(SCEN).forEach((k,i)=>{
    const b=document.createElement('button'); b.textContent=k; if(i===0)b.className='on';
    b.onclick=()=>{ [...sw.children].forEach(x=>x.className=''); b.className='on'; SCEN[k](); };
    sw.appendChild(b);
  });
  SCEN[Object.keys(SCEN)[0]]();
</script>
