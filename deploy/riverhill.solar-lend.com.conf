# riverhill.solar-lend.com — 리버힐 캐디 앱 (Apache 리버스 프록시 → Node 127.0.0.1:3000)
# ─────────────────────────────────────────────────────────────────────────────
# 배치 경로: /etc/apache2/sites-available/riverhill.solar-lend.com.conf
# 사전:  sudo a2enmod proxy proxy_http    (모듈 활성화 — 기존 config 안 건드림)
# 활성:  sudo a2ensite riverhill.solar-lend.com.conf && sudo systemctl reload apache2
# HTTPS: sudo certbot --apache -d riverhill.solar-lend.com
#        → 443 vhost(-le-ssl.conf)·80→443 리다이렉트·자동갱신 등록까지 certbot이 생성
#
# ★기존 vhost(bukbuid·viberush)는 절대 수정하지 않음 — 이 새 파일만 추가.
# ★Apache는 Host 헤더로 vhost를 분기하므로 기존 두 앱과 완전 격리.
<VirtualHost *:80>
    ServerName riverhill.solar-lend.com

    # ── Digital Asset Links (Play Store TWA 앱↔웹 인증) ──
    #  정적 파일로 서빙(Node로 프록시 안 함) → Node 재시작·다운과 무관하게 항상 응답, 캐시 유리.
    #  파일: /var/www/riverhill-well-known/assetlinks.json  (기존 /var/www/html·viberush와 별도 새 디렉터리)
    Alias /.well-known/assetlinks.json /var/www/riverhill-well-known/assetlinks.json
    <Directory /var/www/riverhill-well-known>
        Require all granted
    </Directory>
    ProxyPass /.well-known/assetlinks.json !   # ← 이 경로는 프록시에서 제외(위 Alias가 처리). 반드시 아래 catch-all보다 먼저.

    # ── 그 외 전부 Node 앱으로 ──
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # 앱별 로그 분리(기존 access/error.log와 안 섞이게)
    ErrorLog  ${APACHE_LOG_DIR}/riverhill_error.log
    CustomLog ${APACHE_LOG_DIR}/riverhill_access.log combined
</VirtualHost>

# 참고: 관리자 모니터(:3100)는 이 vhost에 넣지 않음 —
#  모니터 프런트가 절대경로 /api/* 를 써서 앱과 충돌하고, 관리자 전용이라 공개 불필요.
#  → Lightsail에 Tailscale 설치해 사설망(tailnet)에서 <tailscale-ip>:3100 으로만 접근.
